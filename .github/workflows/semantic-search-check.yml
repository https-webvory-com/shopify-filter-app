name: Verify semantic search
on:
  workflow_dispatch:
    inputs:
      shop:
        type: choice
        default: another-shpyfy-store.myshopify.com
        options:
          - another-shpyfy-store.myshopify.com
          - thedressoutlet.myshopify.com
      query:
        type: string
        default: equipment for winter sports
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read deployed provider and verify semantic retrieval
        uses: appleboy/ssh-action@v1.0.3
        env:
          AUDIT_SHOP: ${{ inputs.shop }}
          AUDIT_QUERY: ${{ inputs.query }}
        with:
          envs: AUDIT_SHOP,AUDIT_QUERY
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            docker exec -i -e AUDIT_SHOP -e AUDIT_QUERY shopify-filter-app node --input-type=module <<'NODE'
            import client from './app/services/meiliClient.server.js';
            import {semanticProvider} from './app/utils/semanticSearch.js';
            const shop=process.env.AUDIT_SHOP || 'another-shpyfy-store.myshopify.com';
            if(!['another-shpyfy-store.myshopify.com','thedressoutlet.myshopify.com'].includes(shop))throw Error('Unsupported audit scope');
            const query=process.env.AUDIT_QUERY || 'equipment for winter sports';
            const provider=semanticProvider();
            console.log('RUNTIME',JSON.stringify({shop,query,provider,openaiKeyPresent:!!process.env.OPENAI_API_KEY,semanticDisabled:process.env.SEMANTIC_SEARCH_ENABLED==='false',autoSetupEnabled:process.env.SEMANTIC_EMBEDDING_SETUP_ENABLED==='true'}));
            const index=client.index('products');
            let failures=0;
            async function check(name,fn){try{console.log(name,JSON.stringify(await fn()));}catch(error){failures++;console.log(name,JSON.stringify({failed:true,status:error.status||error.httpStatus,code:error.code||error.cause?.code||error.name}));}}
            await check('EMBEDDERS',async()=>Object.fromEntries(Object.entries((await index.getSettings()).embedders || {}).map(([name,c])=>[name,{source:c.source,model:c.model,dimensions:c.dimensions,relayProvider:c.request?.provider}])));
            await check('INDEX_STATS',async()=>{const s=await index.getStats();return {documents:s.numberOfDocuments,isIndexing:s.isIndexing,embeddedDocuments:s.numberOfEmbeddedDocuments,embeddings:s.numberOfEmbeddings};});
            await check('RECENT_SETTINGS_TASKS',async()=>{const r=await client.tasks.getTasks({indexUids:['products'],types:['settingsUpdate'],limit:5});return r.results.map(t=>({uid:t.uid,status:t.status,errorCode:t.error?.code,startedAt:t.startedAt,finishedAt:t.finishedAt}));});
            await check('EMBEDDING_PROGRESS',async()=>{const t=(await client.tasks.getTasks({indexUids:['products'],types:['settingsUpdate'],limit:1})).results[0];if(!t)return {status:'no_settings_tasks'};const config=t.details?.embedders?.openai;let progress;if(t.batchUid!=null&&client.batches){const b=await client.batches.getBatch(t.batchUid);progress=b.progress;}return {uid:t.uid,status:t.status,source:config?.source,model:config?.model,dimensions:config?.dimensions,progress};});
            if(process.env.OPENAI_API_KEY)await check('OPENAI_PROBE',async()=>{const r=await fetch('https://api.openai.com/v1/embeddings',{method:'POST',headers:{Authorization:'Bearer '+process.env.OPENAI_API_KEY,'Content-Type':'application/json'},body:JSON.stringify({model:'text-embedding-3-small',dimensions:768,input:'snowboard'}),signal:AbortSignal.timeout(20000)});const d=await r.json();return {status:r.status,dimensions:d.data?.[0]?.embedding?.length,errorCode:d.error?.code};});
            for(const [mode,ratio] of [['KEYWORD',null],['SEMANTIC_ONLY',1],['HYBRID',0.5]])await check(mode,async()=>{const r=await index.search(query,{filter:[`shop = '${shop}'`,"status = 'ACTIVE'"],limit:6,attributesToRetrieve:['id','title','productType'],...(ratio===null?{}:{hybrid:{embedder:'openai',semanticRatio:ratio}})});return {semanticHitCount:r.semanticHitCount,total:r.estimatedTotalHits,processingTimeMs:r.processingTimeMs,products:r.hits};});
            process.exitCode=failures ? 1 : 0;
            NODE

name: Inspect EC2 deployment disk
on:
  workflow_dispatch:
    inputs:
      recover_redis:
        description: 'Replace the Redis container using its existing persistent volume and a new local credential'
        required: false
        default: 'false'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect disk and Docker storage
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            df -h /
            docker image ls --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.Size}}'
            docker ps -a --format '{{.Names}} {{.Image}} {{.Status}}'
            docker ps -aq | while read -r container_id; do
              docker inspect --format '{{.Name}} {{.HostConfig.LogConfig.Type}} {{json .HostConfig.LogConfig.Config}} {{.LogPath}}' "$container_id"
              log_path=$(docker inspect --format '{{.LogPath}}' "$container_id")
              if [ -n "$log_path" ]; then sudo -n du -h "$log_path"; fi
            done
            sudo -n du -xhd1 /var/log /var/lib /home/ubuntu 2>/dev/null | sort -h
            sudo -n du -xhd1 /var/lib/docker 2>/dev/null | sort -h

            # Read-only diagnostics for intermittent 502 responses during sync.
            free -m
            docker stats --no-stream --format '{{.Name}} Memory={{.MemUsage}} CPU={{.CPUPerc}}'
            for app_container in shopify-filter-app shopify-filter-sync-worker; do
              if docker inspect "$app_container" >/dev/null 2>&1; then
                docker inspect --format '{{.Name}} Status={{.State.Status}} Started={{.State.StartedAt}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Restarts={{.RestartCount}} MemoryLimit={{.HostConfig.Memory}}' "$app_container"
                docker logs --tail 300 "$app_container" 2>&1 | grep -E 'FATAL ERROR:|heap out of memory|Reached heap limit|JavaScript heap' | tail -n 10 || true
              fi
            done
            sudo -n dmesg --ctime 2>/dev/null | grep -E 'Out of memory|Killed process|oom-kill' | tail -n 15 || true
            # Summarize nginx failures without exposing request URLs or tokens.
            for failure_kind in 'upstream prematurely closed' 'upstream timed out' 'connect() failed'; do
              failure_count=$(sudo -n tail -n 1000 /var/log/nginx/error.log 2>/dev/null | grep -F -c "$failure_kind" || true)
              echo "nginx $failure_kind occurrences in recent log: $failure_count"
            done
            # Only status metadata for this store; never sessions or credentials.
            docker exec shopify-filter-app node -e 'const {PrismaClient}=require("@prisma/client"); const db=new PrismaClient(); db.syncJob.findMany({where:{shop:{in:["thedressoutlet.myshopify.com","another-shpyfy-store.myshopify.com"]},kind:"PRODUCTS"},orderBy:{createdAt:"desc"},take:5,select:{shop:true,id:true,status:true,productsProcessed:true,totalProducts:true,retryCount:true,completedAt:true,updatedAt:true}}).then(rows=>console.log("SYNC_AUDIT",JSON.stringify(rows))).catch(error=>{console.error("SYNC_AUDIT_FAILED",error.code||error.name);process.exitCode=1;}).finally(()=>db.$disconnect())'
            # Redis diagnostics reveal only configuration presence, never values.
            echo 'REDIS_DIAGNOSTIC_BEGIN'
            sudo -n systemctl is-active redis-server 2>/dev/null || true
            sudo -n ss -lntp '( sport = :6379 )' 2>/dev/null || true
            for config_path in /etc/redis/redis.conf /etc/redis.conf; do
              if sudo -n test -f "$config_path"; then
                echo "REDIS_CONFIG_EXISTS $config_path"
                sudo -n awk '/^[[:space:]]*requirepass[[:space:]]/ {pass=1} /^[[:space:]]*aclfile[[:space:]]/ {acl=1} END {print "REDIS_REQUIREPASS_CONFIGURED",pass?"yes":"no";print "REDIS_ACLFILE_CONFIGURED",acl?"yes":"no"}' "$config_path"
              fi
            done
            if [ -f /home/ubuntu/shopify-filter-app/.env ]; then
              awk -F= '/^REDIS_(URL|PASSWORD|USERNAME)=/ {print "APP_ENV_HAS",$1}' /home/ubuntu/shopify-filter-app/.env
            fi
            redis-cli -h 127.0.0.1 ping 2>&1 | grep -E 'PONG|NOAUTH|Connection refused' || true
            python3 - <<'PY'
            import json, subprocess
            container=json.loads(subprocess.check_output(['docker','inspect','redis']))[0]
            config=container['Config']; command=config.get('Cmd') or []; entry=config.get('Entrypoint') or []
            environment=[part.split('=',1)[0] for part in config.get('Env') or []]
            print('REDIS_CONTAINER_STARTED',container['State']['StartedAt'])
            print('REDIS_COMMAND_REQUIREPASS', '--requirepass' in command or '--requirepass' in entry)
            print('REDIS_COMMAND_ACLFILE', '--aclfile' in command or '--aclfile' in entry)
            print('REDIS_ENV_KEYS',','.join(key for key in environment if 'REDIS' in key or 'PASS' in key or 'ACL' in key))
            print('REDIS_MOUNT_DESTINATIONS',','.join(m['Destination'] for m in container.get('Mounts') or []))
            print('REDIS_SAFE_COMMAND',','.join(part for part in command if part in ('redis-server','--appendonly','yes','no','--save','--protected-mode')))
            print('REDIS_RESTART_POLICY',container['HostConfig']['RestartPolicy']['Name'])
            print('REDIS_MOUNT_KINDS',','.join(m['Type']+':'+m['Destination'] for m in container.get('Mounts') or []))
            print('REDIS_PORT_BINDINGS',json.dumps(container['HostConfig']['PortBindings']))
            for name in subprocess.check_output(['docker','ps','--format','{{.Names}}'],text=True).splitlines():
                item=json.loads(subprocess.check_output(['docker','inspect',name]))[0]
                keys=[part.split('=',1)[0] for part in item['Config'].get('Env') or []]
                relevant=[key for key in keys if any(word in key.upper() for word in ('REDIS','CACHE','QUEUE','BULL'))]
                networks=sorted(item['NetworkSettings'].get('Networks') or {})
                print('CONTAINER_REDIS_AUDIT',json.dumps({'name':name,'envKeys':relevant,'networks':networks}))
            PY
            docker exec redis sh -c 'for path in /data/dump.rdb /data/appendonly.aof /data/appendonlydir; do if test -e "$path"; then ls -ldh "$path"; fi; done'
            python3 - <<'PY'
            import ipaddress,subprocess,collections
            lines=subprocess.run(['sudo','-n','ss','-tn','state','established','( sport = :6379 )'],capture_output=True,text=True).stdout.splitlines()[1:]
            groups=collections.Counter()
            for line in lines:
                peer=line.split()[-1].rsplit(':',1)[0].strip('[]')
                try:
                    address=ipaddress.ip_address(peer)
                    label='loopback' if address.is_loopback else 'private' if address.is_private else 'public'
                except ValueError: label='unknown'
                groups[label]+=1
            print('REDIS_ESTABLISHED_PEERS',dict(groups))
            PY
            docker exec wishlist-growth node -e 'try{const p=require("./package.json"); const deps={...p.dependencies,...p.devDependencies}; console.log("WISHLIST_REDIS_PACKAGES",Object.keys(deps).filter(name=>/redis|bull|cache/i.test(name)).join(",")||"none")}catch{console.log("WISHLIST_REDIS_PACKAGES unavailable")}' || true
            wishlist_redis_errors=$(docker logs --since 2026-10-30T00:00:00Z wishlist-growth 2>&1 | grep -Eic 'redis|NOAUTH' || true)
            echo "WISHLIST_REDIS_LOG_MATCHES $wishlist_redis_errors"
            echo 'REDIS_DIAGNOSTIC_END'
  recover_redis:
    if: ${{ inputs.recover_redis == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore authenticated Redis with the existing data volume
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -eu
            app_env="$HOME/shopify-filter-app/.env"
            backup_env="$HOME/shopify-filter-app/.env.before-redis-recovery"
            test -f "$app_env"
            test ! -e "$backup_env"
            redis_volume=$(docker inspect redis --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}')
            test -n "$redis_volume"
            docker exec redis test -s /data/dump.rdb
            test "$(docker inspect redis --format '{{.HostConfig.RestartPolicy.Name}}')" = unless-stopped
            docker inspect redis --format '{{json .Config.Cmd}}' | grep -Fq -- '--appendonly'
            redis_password=$(openssl rand -hex 32)
            cp -p "$app_env" "$backup_env"
            printf 'appendonly yes\nrequirepass %s\ndir /data\n' "$redis_password" |
              docker exec -i -u 0 redis sh -c 'umask 077; cat > /data/redis-secure.conf; chown redis:redis /data/redis-secure.conf; chmod 600 /data/redis-secure.conf'
            REDIS_PASSWORD="$redis_password" APP_ENV="$app_env" python3 - <<'PY'
            import os,pathlib
            path=pathlib.Path(os.environ['APP_ENV'])
            lines=[line for line in path.read_text().splitlines() if not line.startswith(('REDIS_PASSWORD=','REDIS_URL=','REDIS_USERNAME='))]
            lines.append('REDIS_PASSWORD='+os.environ['REDIS_PASSWORD'])
            path.write_text('\n'.join(lines)+'\n')
            path.chmod(0o600)
            PY
            old_stopped=false
            replaced=false
            rollback() {
              failure_code="$1"
              trap - EXIT
              if [ "$replaced" = true ]; then
                docker rm -f redis >/dev/null 2>&1 || true
                docker rename redis-before-cfp-recovery redis || true
                docker start redis >/dev/null || true
              elif [ "$old_stopped" = true ]; then
                docker start redis >/dev/null || true
              fi
              cp -p "$backup_env" "$app_env"
              docker exec -u 0 redis rm -f /data/redis-secure.conf >/dev/null 2>&1 || true
              echo 'Redis recovery failed; previous container and app environment restored.'
              exit "$failure_code"
            }
            trap 'rollback "$?"' EXIT
            docker stop -t 120 redis >/dev/null
            old_stopped=true
            docker rename redis redis-before-cfp-recovery
            replaced=true
            docker run -d --name redis --restart unless-stopped -p 6379:6379 \
              -v "$redis_volume:/data" redis:7-alpine redis-server /data/redis-secure.conf >/dev/null
            ready=false
            for attempt in $(seq 1 90); do
              if docker exec -e REDISCLI_AUTH="$redis_password" redis redis-cli ping 2>/dev/null | grep -qx PONG; then
                ready=true
                break
              fi
              sleep 2
            done
            test "$ready" = true
            restored_keys=$(docker exec -e REDISCLI_AUTH="$redis_password" redis redis-cli dbsize)
            test "$restored_keys" -gt 0
            replaced=false
            trap - EXIT
            unset redis_password
            echo 'Redis recovery succeeded; existing data volume and previous stopped container retained.'

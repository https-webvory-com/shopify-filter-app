name: Verify targeted Cocktail membership
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -eu
            printf '%s' 'WyIxNTIzNDQyMzcxODI1OSIsIjc1MDI3MzAwMzUyNjEiXQ==' | base64 -d | docker exec -i shopify-filter-app sh -c 'cat > /tmp/cfp-cocktail-membership-20261021.json'
            docker exec shopify-filter-app timeout 180 node scripts/repair-product-memberships.mjs --shop thedressoutlet.myshopify.com --ids /tmp/cfp-cocktail-membership-20261021.json --apply

name: Verify targeted Cocktail membership
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -eu
            printf '%s' '' | base64 -d | docker exec -i shopify-filter-app timeout 150 node --input-type=module

name: Configure semantic search
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meilisearch-semantic-setup
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Configure selected provider and verify retrieval
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 105m
          script: |
            set -eu
            docker exec -i shopify-filter-app node --input-type=module <<'NODE'
            import fs from 'node:fs';
            import client from './app/services/meiliClient.server.js';
            import {semanticProvider,semanticEmbedderSettings} from './app/utils/semanticSearch.js';
            try {
              const provider=semanticProvider();
              if(provider!=='openai')throw Object.assign(Error('Provider mismatch'),{code:'provider_not_openai'});
              const settings=semanticEmbedderSettings();
              const config=settings.openai;
              console.log('PROVIDER',JSON.stringify({provider,source:config.source,model:config.model,dimensions:config.dimensions}));
              const probe=await fetch(config.source==='rest'?config.url:'https://api.openai.com/v1/embeddings',{
                method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(config.source==='rest'?process.env.SEMANTIC_RELAY_TOKEN:process.env.OPENAI_API_KEY)},
                body:JSON.stringify(config.source==='rest'?{provider:'openai',texts:['winter sports equipment']}:{model:config.model,dimensions:config.dimensions,input:'winter sports equipment'}),signal:AbortSignal.timeout(30000)});
              const result=await probe.json();
              const dimensions=config.source==='rest'?result.embeddings?.[0]?.values?.length:result.data?.[0]?.embedding?.length;
              console.log('PROVIDER_PROBE',JSON.stringify({status:probe.status,dimensions,errorCode:result.error?.code}));
              if(!probe.ok||dimensions!==config.dimensions)throw Object.assign(Error('Probe failed'),{code:'provider_probe_failed'});
              const index=client.index('products');
              const existing=(await index.getSettings()).embedders||{};
              const configured=Object.keys(existing).length===1&&existing.openai&&existing.openai.source===config.source&&existing.openai.dimensions===config.dimensions&&existing.openai.model===config.model&&(config.source!=='rest'||existing.openai.request?.provider==='openai');
              let task;
              if(configured)console.log('EMBEDDER_ALREADY_CONFIGURED');
              else {
                task=await index.updateSettings({embedders:settings});
                console.log('EMBEDDER_TASK_UID',task.taskUid);
                const deadline=Date.now()+100*60000;
                for(;;){
                  const state=await client.tasks.getTask(task.taskUid);
                  console.log('EMBEDDER_TASK',JSON.stringify({uid:state.uid,status:state.status,errorCode:state.error?.code}));
                  if(state.status==='succeeded')break;
                  if(['failed','canceled'].includes(state.status))throw Object.assign(Error('Embedding failed'),{code:state.error?.code||state.status});
                  if(Date.now()>deadline)throw Object.assign(Error('Embedding timeout'),{code:'embedding_still_pending'});
                  await new Promise(resolve=>setTimeout(resolve,30000));
                }
              }
              const embedders=(await index.getSettings()).embedders||{};
              console.log('EMBEDDERS',JSON.stringify(Object.fromEntries(Object.entries(embedders).map(([name,c])=>[name,{source:c.source,model:c.model,dimensions:c.dimensions,provider:c.request?.provider}]))));
              const stats=await index.getStats();
              console.log('INDEX_STATS',JSON.stringify({documents:stats.numberOfDocuments,embeddedDocuments:stats.numberOfEmbeddedDocuments,embeddings:stats.numberOfEmbeddings,isIndexing:stats.isIndexing}));
              for(const [shop,query] of [['another-shpyfy-store.myshopify.com','equipment for winter sports'],['thedressoutlet.myshopify.com','blue plus size dress for wedding']]){
                for(const ratio of [1,0.5]){
                  const response=await index.search(query,{filter:[`shop = '${shop}'`,"status = 'ACTIVE'"],limit:6,attributesToRetrieve:['id','title','productType'],hybrid:{embedder:'openai',semanticRatio:ratio}});
                  console.log('SEARCH_VERIFICATION',JSON.stringify({shop,query,ratio,semanticHitCount:response.semanticHitCount,products:response.hits}));
                  if(ratio===1&&!(response.semanticHitCount>0))throw Object.assign(Error('No semantic hits'),{code:'no_semantic_hits'});
                }
              }
              console.log('OPENAI_SEMANTIC_SETUP_VERIFIED');
            } catch(error) {console.error('SETUP_FAILED',JSON.stringify({code:error.code||error.cause?.code||error.name,status:error.status||error.httpStatus}));process.exitCode=1;}
            NODE

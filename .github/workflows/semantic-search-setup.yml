name: Configure Gemini semantic search
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meilisearch-semantic-setup
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Enable vector search and configure Gemini
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 100m
          script: |
            set -eu
            docker exec -i shopify-filter-app node --input-type=module <<'NODE'
            import fs from 'node:fs';
            const shop = 'thedressoutlet.myshopify.com';
            const query = 'i want a red dress for office';
            // Read the deployed client's configuration without logging credentials.
            const file = ['app/services/meiliClient.server.js', '/app/app/services/meiliClient.server.js'].find(p => fs.existsSync(p));
            if (!file) { console.log('CHECK_FAILED: deployed Meilisearch client source unavailable'); process.exit(1); }
            const source = fs.readFileSync(file, 'utf8');
            const key = source.match(/apiKey:\s*["']([^"']+)["']/)?.[1];
            const hostVariable = source.match(/host:\s*([a-zA-Z_][a-zA-Z0-9_]*)\s*,/)?.[1];
            const host = hostVariable ? source.match(new RegExp('(?:const|let)\\s+' + hostVariable + '\\s*=\\s*["\']([^"\']+)["\']'))?.[1] : source.match(/host:\s*["']([^"']+)["']/)?.[1];
            if (!key || !host) { console.log('CHECK_FAILED: unsupported client configuration'); process.exit(1); }
            
            async function request(path, body, method = body ? 'POST' : 'GET') {
             const response = await fetch(host + path, { method, headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' }, signal: AbortSignal.timeout(60000), ...(body ? {body:JSON.stringify(body)} : {}) });
             const result = await response.json();
             if (!response.ok) { const error = new Error('HTTP ' + response.status + ' ' + (result.code || 'request_failed') + ': ' + (result.message || ''));  throw error; }
             return result;
            }
            try {
             if (!process.env.GEMINI_API_KEY) throw new Error('GEMINI_API_KEY missing in app container');
             const { geminiEmbedder } = await import('./app/utils/semanticSearch.js');
             const config = geminiEmbedder(process.env.GEMINI_API_KEY);
            config.documentTemplate = "{{doc.title}}. {{doc.productType}} by {{doc.vendor}}. Colors: {{doc.option_Color}}. Tags: {{doc.tags}}";
            config.documentTemplateMaxBytes = 2000;
             // Verify the provider before changing Meilisearch or embedding the catalog.
             const provider = await fetch(config.url, { method:'POST', headers:{'Content-Type':'application/json'}, signal:AbortSignal.timeout(60000), body:JSON.stringify({...config.request,content:{parts:[{text:'red dress for office'}]}}) });
             const probe = await provider.json();
             if (!provider.ok) throw new Error('Gemini probe failed: HTTP ' + provider.status + ' ' + (probe.error?.status || 'provider_error'));
             if (probe.embedding?.values?.length !== config.dimensions) throw new Error('Gemini dimension mismatch');
             console.log('GEMINI_PROBE_OK dimensions=' + config.dimensions);
             console.log('VERSION', JSON.stringify(await request('/version')));
             const flags = await request('/experimental-features');
             if (flags.vectorStore === false) {
               const enabled = await request('/experimental-features', {vectorStore:true}, 'PATCH');
               if (enabled.vectorStore !== true) throw new Error('Vector store did not enable');
               console.log('VECTOR_STORE_ENABLED');
             } else console.log('VECTOR_STORE_ALREADY_AVAILABLE');
             const existing = await request('/indexes/products/settings/embedders');
             const readyConfig = existing?.default;
             let task;
             if (JSON.stringify(readyConfig) === JSON.stringify(config)) console.log('EMBEDDER_CONFIGURATION_UNCHANGED');
             else {
               task = await request('/indexes/products/settings/embedders', {default:config}, 'PATCH');
               console.log('EMBEDDER_TASK_UID',task.taskUid);
             }
             if (task) {
               const deadline=Date.now()+90*60*1000;
               while(true) {
                 const state=await request('/tasks/'+task.taskUid);
                 console.log('EMBEDDER_TASK',JSON.stringify({uid:state.uid,status:state.status,errorCode:state.error?.code}));
                 if(state.status==='succeeded') break;
                 if(['failed','canceled'].includes(state.status)) throw new Error('Embedder task '+state.status+': '+(state.error?.code||'unknown'));
                 if(Date.now()>deadline) throw new Error('Embedding task still pending; rerun diagnostic to monitor UID '+task.taskUid);
                 await new Promise(resolve=>setTimeout(resolve,30000));
               }
             }
             for (const ratio of [1,0.5]) {
               const result=await request('/indexes/products/search',{q:query,filter:["shop = '"+shop+"'", "status = 'ACTIVE'"],limit:5,hybrid:{embedder:'default',semanticRatio:ratio},attributesToRetrieve:['title','productType','option_Color']});
               console.log('SEARCH_VERIFICATION',JSON.stringify({ratio,semanticHitCount:result.semanticHitCount,hits:result.hits}));
               if(ratio===1 && !(result.semanticHitCount>0)) throw new Error('Semantic-only query returned no semantic hits');
             }
             console.log('SEMANTIC_SETUP_VERIFIED');
            } catch(error) {
             // Never print provider responses, settings, URLs or arbitrary error messages.
             const safe=String(error.message).replaceAll(process.env.GEMINI_API_KEY||'__unused__','[redacted]').replaceAll(key,'[redacted]').replace(/https?:\/\/\S+/g,'[url redacted]');
             console.error('SETUP_FAILED',safe); process.exitCode=1;
            }
            
            NODE

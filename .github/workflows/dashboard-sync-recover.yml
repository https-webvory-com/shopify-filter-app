name: Resume saved audit price backfill
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 3m
          script: |
            docker exec -i shopify-filter-app node --input-type=module <<'NODE'
            import {PrismaClient} from '@prisma/client';
            import {Queue} from 'bullmq';
            const db=new PrismaClient();
            const endpoint=new URL(process.env.REDIS_URL || 'redis://184.72.37.227:6379');
            if(!endpoint.password&&process.env.REDIS_PASSWORD)endpoint.password=process.env.REDIS_PASSWORD;
            const connection={host:endpoint.hostname,port:Number(endpoint.port||6379),...(endpoint.password?{password:decodeURIComponent(endpoint.password)}:{})};
            const queue=new Queue('productSyncQueue',{connection});
            const shop='thedressoutlet.myshopify.com';
            try{
              const saved=await db.syncJob.findFirst({where:{shop,kind:'BULK_PRODUCTS'},orderBy:{createdAt:'desc'}});
              if(saved?.status==='IN_PROGRESS')console.log('AUDIT_PRICE_RESUME',JSON.stringify({result:'already-running',id:saved.id,processed:saved.productsProcessed}));
              else {
                if(saved?.id!=='95b11260-a2bb-4603-993c-0fb4f285f443'||saved.status!=='FAILED'||saved.productsProcessed<7080||!saved.cursor||!saved.lastError?.includes('service could not be reached'))throw Error('Saved price checkpoint changed; inspect before retry');
                const queued=await queue.getJob(saved.id);
                const state=queued?await queued.getState():'missing';
                if(!['failed','completed','missing','waiting','delayed','active','prioritized'].includes(state))throw Error('Unexpected queue state '+state);
                await db.syncJob.update({where:{id:saved.id},data:{status:'IN_PROGRESS',lastError:null,retryCount:0}});
                try{
                  if(state==='failed')await queued.retry('failed',{resetAttemptsMade:true,resetAttemptsStarted:true});
                  else if(state==='completed'||state==='missing'){
                    if(state==='completed')await queued.remove();
                    await queue.add('SYNC_PRODUCTS',{shop,syncJobId:saved.id},{jobId:saved.id,attempts:10,backoff:{type:'fixed',delay:15000}});
                  }
                }catch(error){await db.syncJob.update({where:{id:saved.id},data:{status:'FAILED',lastError:saved.lastError}});throw error;}
                console.log('AUDIT_PRICE_RESUME',JSON.stringify({result:'queued',id:saved.id,processed:saved.productsProcessed,priorQueueState:state}));
              }
            }finally{await db.$disconnect();await queue.close();}
            NODE

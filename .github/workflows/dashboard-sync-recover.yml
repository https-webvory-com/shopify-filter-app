name: India-only saved variant price repair
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            docker exec shopify-filter-sync-worker test -f /app/scripts/backfill-india-variant-prices.mjs
            docker exec -d shopify-filter-sync-worker sh -c 'node /app/scripts/backfill-india-variant-prices.mjs --shop thedressoutlet.myshopify.com --source-job 95b11260-a2bb-4603-993c-0fb4f285f443 --apply > /tmp/india-price-backfill.log 2>&1'
            sleep 5
            docker exec shopify-filter-sync-worker sh -c 'if test -f /tmp/india-price-backfill.log; then tail -n 5 /tmp/india-price-backfill.log; else echo India price job log not created; exit 1; fi'

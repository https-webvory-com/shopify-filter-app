name: Recover stopped dashboard syncs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker exec -i shopify-filter-app node --input-type=module <<'NODE'
            import {PrismaClient} from '@prisma/client';
            import {enqueueProductSync,productSyncQueue} from './app/services/productSyncQueue.server.js';
            import {webhookQueue} from './app/services/queue.server.js';
            const db=new PrismaClient();
            try {
              for(const shop of ['thedressoutlet.myshopify.com','another-shpyfy-store.myshopify.com']){
                const job=await db.syncJob.findFirst({where:{shop,kind:'PRODUCTS'},orderBy:{createdAt:'desc'}});
                if(job?.status!=='FAILED'||!job.lastError?.includes('Shopify pagination stopped')){console.log('RECOVERY_NOT_NEEDED',shop);continue;}
                const session=await db.session.findFirst({where:{shop,isOnline:false},select:{accessToken:true}});
                if(!session?.accessToken)throw new Error('Offline store session unavailable');
                const response=await fetch('https://'+shop+'/admin/api/2026-07/graphql.json',{method:'POST',headers:{'Content-Type':'application/json','X-Shopify-Access-Token':session.accessToken},body:JSON.stringify({query:'query { productsCount(limit:null) { count precision } }'})});
                const result=await response.json();const count=result.data?.productsCount;
                if(!response.ok||result.errors?.length||count?.precision!=='EXACT')throw new Error('Store count unavailable');
                // Earlier scans counted published products against the entire catalog.
                // Replay only when that checkpoint cannot verify the whole catalog.
                const replay=job.productsProcessed<count.count;
                await db.syncJob.update({where:{id:job.id},data:{status:'IN_PROGRESS',lastError:null,retryCount:0,completedAt:null,totalProducts:count.count,...(replay?{cursor:null,productsProcessed:0}:{})}});
                try{await enqueueProductSync(job.id,shop);}catch(error){await db.syncJob.update({where:{id:job.id},data:{status:'FAILED',lastError:job.lastError,cursor:job.cursor,productsProcessed:job.productsProcessed}});throw error;}
                console.log('SYNC_RECOVERY_QUEUED',JSON.stringify({shop,id:job.id,replay,total:count.count}));
              }
            }finally{await productSyncQueue.close();await webhookQueue.close();await db.$disconnect();}
            NODE

name: Deploy to EC2      

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-west-1
  ECR_REGISTRY: 450367038243.dkr.ecr.us-west-1.amazonaws.com
  ECR_REPOSITORY: shopify
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # A failing test must stop the release before images or live containers change.
      - name: Set up production Node version for checks
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Check ranking, cache, webhook and storefront regressions
        run: |
          node scripts/run-regression-tests.mjs
          node --check extensions/theme-extension/assets/collectionFilterPro.js
          node --check extensions/theme-extension/assets/instantSearch.js
          node --max-old-space-size=256 tests/collection-loading/run-memory-check.mjs tags
          node --max-old-space-size=256 tests/collection-loading/run-memory-check.mjs variants
          node --max-old-space-size=256 tests/collection-loading/run-memory-check.mjs dense-variants

      - name: Create .env
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login \
            --username AWS \
            --password-stdin $ECR_REGISTRY

      - name: Build Docker Image
        run: |
          docker build -t shopify .

      - name: Smoke-test container startup maintenance
        # The maintenance check uses an in-container loopback Redis fixture only.
        # Its actual Alpine/Node process must exit cleanly before EC2 is touched.
        run: |
          docker run --rm --network none shopify:latest node --test tests/sync/startup-cache.test.mjs

      - name: Smoke-test built web and worker initialization
        # Preserve the bundled ESM graph; stub external infrastructure only.
        # Catch import cycles before publishing an image or replacing EC2 containers.
        run: docker run --rm --network none shopify:latest node tests/sync/run-built-startup.mjs

      - name: Tag Docker Image
        run: |
          docker tag shopify:latest \
          $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Push Docker Image
        run: |
          docker push \
          $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


      - name: Deploy to EC2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SEMANTIC_EMBEDDING_PROVIDER: openai
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          envs: OPENAI_API_KEY,SEMANTIC_EMBEDDING_PROVIDER,GEMINI_API_KEY
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -eu

            AWS_REGION=us-west-1
            ECR_REGISTRY=450367038243.dkr.ecr.us-west-1.amazonaws.com
            ECR_REPOSITORY=shopify


            # Reclaim only unused Docker data; keep containers and volumes.
            df -h /var/lib/docker /var/lib/containerd
            docker system df
            docker image prune -f
            docker builder prune -f
            # Remove old images for this app only, never an image used by any
            # running or stopped container (including the current release).
            for app_repository in "$ECR_REGISTRY/$ECR_REPOSITORY" shopify-filter-app 450367038243.dkr.ecr.ap-south-1.amazonaws.com/shopify_filter; do
              docker image ls --format '{{.Repository}}:{{.Tag}}' "$app_repository" | while read -r image_ref; do
                if [ -z "$(docker ps -aq --filter ancestor="$image_ref")" ]; then
                  docker image rm "$image_ref"
                fi
              done
            done
            df -h /var/lib/containerd

            # Image pruning cannot reclaim application logs or volume data.
            # Fail before login/pull and leave the running release in place.
            available_kb=$(df -Pk /var/lib/docker /var/lib/containerd | awk 'NR > 1 { if (!seen || $4 < minimum) minimum=$4; seen=1 } END { print minimum }')
            if [ "$available_kb" -lt 2097152 ]; then
              echo "Deployment stopped: at least 2 GiB of free space is required before pulling the image."
              echo "Inspect container logs and expand the EC2 disk or reclaim explicitly approved data."
              docker ps -aq | while read -r container_id; do
                docker inspect --format '{{.Name}} {{.HostConfig.LogConfig.Type}} {{json .HostConfig.LogConfig.Config}}' "$container_id"
                log_path=$(docker inspect --format '{{.LogPath}}' "$container_id")
                if [ -n "$log_path" ]; then sudo -n du -h "$log_path" || true; fi
              done
              exit 1
            fi

            # Login writes Docker credentials, so reclaim space first.
            aws ecr get-login-password --region $AWS_REGION | \
            docker login \
            --username AWS \
            --password-stdin $ECR_REGISTRY

            docker pull \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest


            cd /home/ubuntu/shopify-filter-app

            # Update provider credentials, preserving the rest of the server environment.
            # An unset repository secret leaves the existing server key unchanged.
            python3 - <<'PY'
            import os
            import pathlib
            import re
            updates = {name: os.environ[name] for name in ("OPENAI_API_KEY", "GEMINI_API_KEY") if os.environ.get(name)}
            if updates.get("OPENAI_API_KEY"):
                updates["SEMANTIC_EMBEDDING_PROVIDER"] = "openai"
            if updates:
                path = pathlib.Path(".env")
                content = path.read_text() if path.exists() else ""
                lines = [line for line in content.splitlines() if not any(re.match(r"^\s*" + re.escape(name) + r"\s*=", line) for name in updates)]
                lines.extend(name + "=" + value for name, value in updates.items())
                path.write_text("\n".join(lines) + "\n")
                path.chmod(0o600)
            PY

            # Apply additive defaults before stopping the working app or db push.
            docker run --rm \
            --env-file .env \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            npx prisma db execute --file scripts/prepare-quick-view.sql --schema prisma/schema.prisma

            # Check Redis before replacing healthy containers. A missing or stale
            # credential must stop this rollout without interrupting shoppers.
            docker run --rm --env-file .env \
              $ECR_REGISTRY/$ECR_REPOSITORY:latest \
              node --input-type=module -e '
                import Redis from "ioredis";
                import {redisConnectionOptions} from "./app/services/redisConnection.server.js";
                const client = new Redis({...redisConnectionOptions,lazyConnect:true,
                  maxRetriesPerRequest:1,connectTimeout:5000,retryStrategy:()=>null});
                client.on("error",()=>{});
                try { await client.connect(); await client.ping(); console.log("Redis preflight passed"); }
                catch { console.error("Redis preflight failed; check server Redis credentials"); process.exitCode=1; }
                finally { client.disconnect(); }
              '

            # Zero-downtime web rollout. Shoppers reach the app through nginx;
            # the search engine's embedding relay calls port 3005 directly, so
            # the final container must always serve 3005:
            #   1. new version on spare port 3006 -> nginx to 3006
            #   2. replace the 3005 container with the new version
            #   3. nginx back to 3005, remove the spare copy.
            NGINX_SITE=/etc/nginx/sites-enabled/aisearchfilter.webvory.com
            previous_app_image=$(docker inspect --format '{{.Image}}' shopify-filter-app 2>/dev/null || true)
            previous_worker_image=$(docker inspect --format '{{.Image}}' shopify-filter-sync-worker 2>/dev/null || true)
            docker rm -f shopify-filter-app-next >/dev/null 2>&1 || true
            sudo cp "$NGINX_SITE" /tmp/aisearchfilter.nginx.bak

            point_nginx() {
              sudo sed -i -E "s#proxy_pass http://127\.0\.0\.1:(3005|3006)#proxy_pass http://127.0.0.1:$1#" "$NGINX_SITE"
              sudo nginx -t && sudo nginx -s reload
            }
            wait_http() {
              for attempt in $(seq 1 40); do
                if curl -fsS -o /dev/null --max-time 3 "http://127.0.0.1:$1/healthz"; then return 0; fi
                sleep 3
              done
              return 1
            }
            run_web() {
              docker run -d --name "$1" --env-file .env -e CFP_WORKER_MODE=web -e PORT=3005 \
                -p "$2:3005" --restart always --log-opt max-size=10m --log-opt max-file=3 "$3"
            }
            stage=start
            recover() {
              code="$1"; trap - EXIT
              [ "$code" -eq 0 ] && return
              set +e
              echo "Rollout failed at stage $stage; recovering."
              if ! curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:3005/healthz; then
                docker rm -f shopify-filter-app >/dev/null 2>&1
                if [ -n "$previous_app_image" ]; then run_web shopify-filter-app 3005 "$previous_app_image"; wait_http 3005; fi
              fi
              if curl -fsS -o /dev/null --max-time 3 http://127.0.0.1:3005/healthz; then
                point_nginx 3005; docker rm -f shopify-filter-app-next >/dev/null 2>&1
              else
                echo "3005 is not healthy; leaving nginx on the spare copy if it is serving."
              fi
              if ! docker ps --format '{{.Names}}' | grep -qx shopify-filter-sync-worker && [ -n "$previous_worker_image" ]; then
                docker run -d --name shopify-filter-sync-worker --env-file .env -e CFP_WORKER_MODE=worker \
                  -e CFP_WEBHOOK_CONCURRENCY=2 -e NODE_OPTIONS=--max-old-space-size=256 \
                  --memory=512m --memory-swap=512m --cpu-shares=256 --restart always \
                  --log-opt max-size=10m --log-opt max-file=3 "$previous_worker_image" node scripts/run-background-worker.mjs
              fi
              exit "$code"
            }
            trap 'recover "$?"' EXIT

            stage=spare
            run_web shopify-filter-app-next 127.0.0.1:3006 $ECR_REGISTRY/$ECR_REPOSITORY:latest
            if ! wait_http 3006; then
              echo "App failed its startup health check."
              docker logs --tail 150 shopify-filter-app-next 2>&1 || true
              exit 1
            fi
            stage=nginx-spare
            point_nginx 3006
            sleep 3

            stage=main
            docker stop --time 30 shopify-filter-app || true
            docker rm shopify-filter-app || true
            run_web shopify-filter-app 3005 $ECR_REGISTRY/$ECR_REPOSITORY:latest
            if ! wait_http 3005; then
              echo "App failed its startup health check on 3005."
              docker logs --tail 150 shopify-filter-app 2>&1 || true
              exit 1
            fi
            stage=nginx-main
            point_nginx 3005
            sleep 3
            docker stop --time 30 shopify-filter-app-next || true
            docker rm shopify-filter-app-next || true
            curl -fsS -o /dev/null --max-time 10 https://aisearchfilter.webvory.com/healthz && echo "Public health check passed." || echo "Public health check did not answer."
            stage=worker

            # Background worker has no shopper traffic; replace it after the web switch.
            docker stop --time 30 shopify-filter-sync-worker || true
            docker rm shopify-filter-sync-worker || true
            docker run -d             --name shopify-filter-sync-worker             --env-file .env             -e CFP_WORKER_MODE=worker             -e CFP_WEBHOOK_CONCURRENCY=2             -e NODE_OPTIONS=--max-old-space-size=256             --memory=512m             --memory-swap=512m             --cpu-shares=256             --restart always             --log-opt max-size=10m             --log-opt max-file=3             $ECR_REGISTRY/$ECR_REPOSITORY:latest             node scripts/run-background-worker.mjs

            worker_ready=false
            for attempt in $(seq 1 45); do
              if docker exec shopify-filter-sync-worker node -e 'process.exit(require("fs").existsSync("/tmp/cfp-background-worker.ready") ? 0 : 1)'; then
                worker_ready=true
                break
              fi
              sleep 2
            done
            if [ "$worker_ready" != true ]; then
              echo "Background worker failed its startup check; the web server remains running."
              docker inspect --format '{{.State.Status}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Restarts={{.RestartCount}}' shopify-filter-sync-worker
              docker logs --tail 150 shopify-filter-sync-worker 2>&1 || true
              docker rm -f shopify-filter-sync-worker || true
              exit 1
            fi

            trap - EXIT
            docker image prune -f || echo "Unused-image cleanup failed."

            echo "Deployment completed successfully."

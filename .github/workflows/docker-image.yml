name: Deploy to EC2      

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-west-1
  ECR_REGISTRY: 450367038243.dkr.ecr.us-west-1.amazonaws.com
  ECR_REPOSITORY: shopify
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login \
            --username AWS \
            --password-stdin $ECR_REGISTRY

      - name: Build Docker Image
        run: |
          docker build -t shopify .

      - name: Tag Docker Image
        run: |
          docker tag shopify:latest \
          $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Push Docker Image
        run: |
          docker push \
          $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


      - name: Deploy to EC2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          envs: GEMINI_API_KEY
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -eu

            AWS_REGION=us-west-1
            ECR_REGISTRY=450367038243.dkr.ecr.us-west-1.amazonaws.com
            ECR_REPOSITORY=shopify


            # Reclaim only unused Docker data; keep containers and volumes.
            df -h /var/lib/docker /var/lib/containerd
            docker system df
            docker image prune -f
            docker builder prune -f
            # Remove old images for this app only, never an image used by any
            # running or stopped container (including the current release).
            for app_repository in "$ECR_REGISTRY/$ECR_REPOSITORY" shopify-filter-app 450367038243.dkr.ecr.ap-south-1.amazonaws.com/shopify_filter; do
              docker image ls --format '{{.Repository}}:{{.Tag}}' "$app_repository" | while read -r image_ref; do
                if [ -z "$(docker ps -aq --filter ancestor="$image_ref")" ]; then
                  docker image rm "$image_ref"
                fi
              done
            done
            df -h /var/lib/containerd

            # Image pruning cannot reclaim application logs or volume data.
            # Fail before login/pull and leave the running release in place.
            available_kb=$(df -Pk /var/lib/docker /var/lib/containerd | awk 'NR > 1 { if (!seen || $4 < minimum) minimum=$4; seen=1 } END { print minimum }')
            if [ "$available_kb" -lt 2097152 ]; then
              echo "Deployment stopped: at least 2 GiB of free space is required before pulling the image."
              echo "Inspect container logs and expand the EC2 disk or reclaim explicitly approved data."
              docker ps -aq | while read -r container_id; do
                docker inspect --format '{{.Name}} {{.HostConfig.LogConfig.Type}} {{json .HostConfig.LogConfig.Config}}' "$container_id"
                log_path=$(docker inspect --format '{{.LogPath}}' "$container_id")
                if [ -n "$log_path" ]; then sudo -n du -h "$log_path" || true; fi
              done
              exit 1
            fi

            # Login writes Docker credentials, so reclaim space first.
            aws ecr get-login-password --region $AWS_REGION | \
            docker login \
            --username AWS \
            --password-stdin $ECR_REGISTRY

            docker pull \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest


            cd /home/ubuntu/shopify-filter-app

            # Update only this key, preserving the rest of the server environment.
            # An unset repository secret leaves the existing server key unchanged.
            python3 - <<'PY'
            import os
            import pathlib
            import re
            key = os.environ.get("GEMINI_API_KEY", "")
            if key:
                path = pathlib.Path(".env")
                content = path.read_text() if path.exists() else ""
                lines = [line for line in content.splitlines() if not re.match(r"^\s*GEMINI_API_KEY\s*=", line)]
                lines.append("GEMINI_API_KEY=" + key)
                path.write_text("\n".join(lines) + "\n")
                path.chmod(0o600)
            PY

            # Apply additive defaults before stopping the working app or db push.
            docker run --rm \
            --env-file .env \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            npx prisma db execute --file scripts/prepare-quick-view.sql --schema prisma/schema.prisma

            docker stop --time 30 shopify-filter-sync-worker || true
            docker rm shopify-filter-sync-worker || true

            docker stop shopify-filter-app || true
            docker rm shopify-filter-app || true


            docker run -d \
            --name shopify-filter-app \
            --env-file .env \
            -e CFP_WORKER_MODE=web \
            -p 3005:3005 \
            --restart always \
            --log-opt max-size=10m \
            --log-opt max-file=3 \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

            # Container startup includes schema sync; wait for the HTTP server.
            ready=false
            for attempt in $(seq 1 30); do
              if docker exec shopify-filter-app node -e 'fetch("http://127.0.0.1:" + (process.env.PORT || "3000"), {redirect: "manual", signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.status >= 200 && r.status < 400 ? 0 : 1)).catch(() => process.exit(1))'; then
                ready=true
                break
              fi
              sleep 3
            done
            if [ "$ready" != true ]; then
              echo "App failed its startup health check."
              exit 1
            fi

            # Isolate background work from the HTTP server with bounded memory.
            docker run -d \
            --name shopify-filter-sync-worker \
            --env-file .env \
            -e CFP_WORKER_MODE=worker \
            -e CFP_WEBHOOK_CONCURRENCY=2 \
            -e NODE_OPTIONS=--max-old-space-size=256 \
            --memory=512m \
            --memory-swap=512m \
            --cpu-shares=256 \
            --restart always \
            --log-opt max-size=10m \
            --log-opt max-file=3 \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            node scripts/run-background-worker.mjs

            worker_ready=false
            for attempt in $(seq 1 45); do
              if docker exec shopify-filter-sync-worker node -e 'process.exit(require("fs").existsSync("/tmp/cfp-background-worker.ready") ? 0 : 1)'; then
                worker_ready=true
                break
              fi
              sleep 2
            done
            if [ "$worker_ready" != true ]; then
              echo "Background worker failed its startup check; the web server remains running."
              docker inspect --format '{{.State.Status}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}} Restarts={{.RestartCount}}' shopify-filter-sync-worker
              exit 1
            fi

            docker image prune -f

            echo "Deployment completed successfully."

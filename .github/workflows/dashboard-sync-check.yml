name: Start scoped market price backfill
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 2m
          script: |
            docker exec -i shopify-filter-app node --input-type=module <<'NODE'
            import {startBulkProductSync} from './app/services/sync.server.js';
            import {productSyncQueue} from './app/services/productSyncQueue.server.js';
            import prisma from './app/db.server.js';
            import redis from './app/services/redis.server.js';
            let failed=false;
            try{
              const result=await startBulkProductSync('thedressoutlet.myshopify.com',{restart:true});
              console.log('MARKET_BACKFILL_START',JSON.stringify({message:result.message,jobCreated:!!result.jobId}));
            }catch(error){failed=true;console.log('MARKET_BACKFILL_ERROR',JSON.stringify({name:error.name,message:String(error.message).replace(/https?:\S+/g,'[url]').slice(0,220)}));}
            finally{await productSyncQueue.close();await redis.quit();await prisma.$disconnect();process.exit(failed?1:0);}
            NODE

name: Inspect private search disk
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1
      - name: Inspect private search instance access
        shell: bash
        env:
          APP_HOST: ${{ secrets.EC2_HOST }}
          APP_USER: ${{ secrets.EC2_USER }}
          APP_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          aws ec2 describe-instances --instance-ids i-0ecb95972f915a915 --query 'Reservations[].Instances[].{az:Placement.AvailabilityZone,ami:ImageId,volumes:BlockDeviceMappings,groups:SecurityGroups}' --output json
          ssh-keygen -t ed25519 -N '' -f /tmp/cfp-diagnostic-key -q
          chmod 600 /tmp/cfp-diagnostic-key
          printf '%s\n' "$APP_KEY" > /tmp/cfp-app-key
          chmod 600 /tmp/cfp-app-key
          aws ec2-instance-connect send-ssh-public-key --instance-id i-0ecb95972f915a915 --instance-os-user ubuntu --ssh-public-key file:///tmp/cfp-diagnostic-key.pub --query Success --output text
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -i /tmp/cfp-diagnostic-key -o ProxyCommand="ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -i /tmp/cfp-app-key -W %h:%p $APP_USER@$APP_HOST" ubuntu@10.0.2.139 'sudo du -ah /var/lib/docker/containers 2>/dev/null | sort -h | tail -n 12; sudo docker ps --format "{{.Names}} {{.ID}}"; sudo docker inspect --format "{{.Name}} {{json .HostConfig.LogConfig}} {{.LogPath}}" $(sudo docker ps -q); sudo docker system df'

name: Read-only price sorting readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            docker exec -i shopify-filter-app node --input-type=module <<'NODE'
            import Redis from 'ioredis';
            import {Queue} from 'bullmq';
            const endpoint=new URL(process.env.REDIS_URL || 'redis://184.72.37.227:6379');
            if(!endpoint.password&&process.env.REDIS_PASSWORD)endpoint.password=process.env.REDIS_PASSWORD;
            const connection={host:endpoint.hostname,port:Number(endpoint.port||6379),...(endpoint.password?{password:decodeURIComponent(endpoint.password)}:{})};
            const redis=new Redis(connection);
            const queue=new Queue('collectionRankingQueueV2',{connection});
            try{
              const counts=await queue.getJobCounts('active','waiting','delayed','failed','completed','prioritized');
              const active=await queue.getJobs(['active'],0,10);
              const waiting=await queue.getJobs(['waiting','prioritized'],0,50);
              console.log('PRICE_RANKING_QUEUE',JSON.stringify({counts,active:active.map(j=>({id:j.id,name:j.name,shop:j.data?.spec?.shop,sort:j.data?.spec?.sortBy,priority:j.opts?.priority,processedOn:j.processedOn})),waiting:waiting.map(j=>({id:j.id,name:j.name,shop:j.data?.spec?.shop,sort:j.data?.spec?.sortBy,priority:j.opts?.priority})).filter(j=>j.sort?.startsWith('price')||j.priority<=1).slice(0,25)}));
            }finally{await queue.close();redis.disconnect();}
            NODE
            docker logs --since 10m --tail 100 shopify-filter-sync-worker 2>&1 | grep -E 'collection preparation|Collection ranking|Ranking Queue|India price|error|Error' | tail -n 35 || true
            docker exec shopify-filter-sync-worker sh -c 'if test -f /tmp/india-price-backfill.log; then tail -n 10 /tmp/india-price-backfill.log; fi'

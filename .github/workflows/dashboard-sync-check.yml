name: Read-only collection readiness audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker exec -i shopify-filter-app node --input-type=module <<'NODE'
            import {PrismaClient} from '@prisma/client';
            import Redis from 'ioredis';
            import {Queue} from 'bullmq';
            import {redisConnectionOptions} from './app/services/redisConnection.server.js';
            import {normalizeCollectionWarmup} from './app/utils/collectionPreparation.js';
            import {publishedCollectionKey} from './app/utils/collectionPublishedPage.js';
            import {decodePreparation} from './app/utils/collectionPreparationPayload.js';
            import {collectionSnapshotStorageText} from './app/utils/collectionLoadingSnapshots.js';
            import meili from './app/services/meiliClient.server.js';
            const shop='thedressoutlet.myshopify.com';
            const handles=['formal-dresses','beach-wedding-guest-dresses','cocktail-dresses'];
            const db=new PrismaClient();
            const redis=new Redis(redisConnectionOptions);
            const ranking=new Queue('collectionRankingQueueV2',{connection:redisConnectionOptions});
            const order=new Queue('collectionOrderQueueV1',{connection:redisConnectionOptions});
            try {
              const collections=await db.collection.findMany({where:{shop,handle:{in:handles}},select:{id:true,handle:true}});
              const allPublished=await db.collectionLoadingSnapshot.count({where:{shop,kind:'published',expiresAt:{gt:new Date()}}});
              console.log('PUBLICATION_TOTAL',allPublished);
              console.log('CONFIG_REVISION',JSON.stringify({revision:await redis.get(`collectionPreparationRevision:${shop}`),invalidatedAt:await redis.get(`collectionConfigurationInvalidatedAt:${shop}`)}));
              const settings=await db.filterGlobalSetting.findUnique({where:{shop},select:{updatedAt:true,showFilterOptionsWithOneItem:true,showOnlyInStock:true,prioritizeSortOverPinning:true,prioritizeSortOverMerchandising:true}});
              const groups=await db.filterGroup.findMany({where:{shop},select:{name:true,updatedAt:true},orderBy:{updatedAt:'desc'},take:3});
              console.log('CONFIG_UPDATES',JSON.stringify({settings,groups}));
              const pins=await db.pinnedProductRule.findMany({where:{shop},select:{updatedAt:true,applyToAll:true},orderBy:{updatedAt:'desc'},take:3});
              const rules=await db.merchandisingRule.findMany({where:{shop},select:{updatedAt:true,ruleType:true,countries:true},orderBy:{updatedAt:'desc'},take:3});
              console.log('RULE_UPDATES',JSON.stringify({pins,rules}));
              const synonyms=await db.synonym.findMany({where:{shop},select:{createdAt:true},orderBy:{createdAt:'desc'},take:5});
              const searchSettings=await db.searchSetting.findUnique({where:{shop},select:{updatedAt:true}});
              console.log('SEARCH_UPDATES',JSON.stringify({synonyms,searchSettings}));
              const shortProm=await db.collection.findFirst({where:{shop,handle:'prom-short-dresses'},select:{id:true,handle:true,title:true}});
              const filterGroups=await db.filterGroup.findMany({where:{shop},select:{id:true,name:true,status:true,isDefault:true,collections:{select:{collectionId:true,collectionTitle:true,pageType:true}},filters:{select:{label:true,filterType:true,filterKey:true,isEnabled:true}}}});
              console.log('SHORT_PROM',JSON.stringify(shortProm));
              console.log('FILTER_GROUPS',JSON.stringify(filterGroups));
              console.log('SAVED_SYNONYMS',JSON.stringify(await db.synonym.findMany({where:{shop},select:{word:true,synonyms:true,isActive:true}})));
              const searchConfig=(await db.searchSetting.findUnique({where:{shop},select:{config:true}}))?.config;
              const activeUid=searchConfig?._index?.active?.uid;
              console.log('SEARCH_INDEX',JSON.stringify({phase:searchConfig?._index?.phase,activeUid}));
              for(const uid of [...new Set(['products',activeUid].filter(Boolean))]){
                const dictionary=await meili.index(uid).getSynonyms();
                const result=await meili.index(uid).search('test',{filter:[`shop = '${shop}'`,`status = 'ACTIVE'`],limit:3,matchingStrategy:'all',attributesToRetrieve:['id','title']});
                console.log('INDEX_PROOF',JSON.stringify({uid,synonymCount:Object.keys(dictionary).length,synonymKeys:Object.keys(dictionary).slice(0,10),test:dictionary.test,shortDress:dictionary['short dress'],testHits:result.hits?.map(hit=>({id:hit.id,title:hit.title})),estimatedTotalHits:result.estimatedTotalHits}));
              }
              try {
                const filter=[`shop = '${shop}'`,`status = 'ACTIVE'`];
                const federated=await meili.multiSearch({queries:[{indexUid:'products',q:'test',filter,matchingStrategy:'all',attributesToRetrieve:['id','title'],federationOptions:{weight:2}},{indexUid:'products',q:'short dress',filter,matchingStrategy:'all',attributesToRetrieve:['id','title']}],federation:{offset:0,limit:10}});
                console.log('FEDERATED_SYNONYM_PROOF',JSON.stringify({keys:Object.keys(federated),count:federated.estimatedTotalHits??federated.totalHits,hits:federated.hits?.map(hit=>({id:hit.id,title:hit.title,source:hit._federation?.queriesPosition}))}));
              } catch(error) {console.log('FEDERATED_SYNONYM_ERROR',JSON.stringify({name:error.name,code:error.code,message:error.message?.slice(0,200)}));}
              try {
                const filter=[`shop = '${shop}'`,`status = 'ACTIVE'`];
                const federated=await meili.multiSearch({queries:[{indexUid:'products',q:'test',filter,matchingStrategy:'all'},{indexUid:'products',q:'short dress',filter,matchingStrategy:'all'}],federation:{offset:0,limit:0,facetsByIndex:{products:['vendor']},mergeFacets:{maxValuesPerFacet:10}}});
                console.log('FEDERATED_FACETS_PROOF',JSON.stringify({keys:Object.keys(federated),count:federated.estimatedTotalHits??federated.totalHits,facetKeys:Object.keys(federated.facetDistribution||{}),vendorCount:Object.keys(federated.facetDistribution?.vendor||{}).length,facetsByIndexKeys:Object.keys(federated.facetsByIndex||{})}));
              } catch(error) {console.log('FEDERATED_FACETS_ERROR',JSON.stringify({name:error.name,code:error.code,message:error.message?.slice(0,200)}));}
              for(const collection of collections){
                const number=collection.id.split('/').pop();
                const rows=await db.collectionLoadingSnapshot.findMany({where:{shop,kind:'published',collectionId:{in:[collection.id,number]}},select:{aliases:true,validatedAt:true,expiresAt:true,size:true,payload:true},orderBy:{validatedAt:'desc'},take:5});
                const raw=await redis.get(`collectionOrderSnapshot:${shop}:${collection.id}`);
                let snapshot=null;try{if(raw){const parsed=JSON.parse(raw);snapshot={count:parsed.ids?.length,ageSeconds:Math.round((Date.now()-parsed.updatedAt)/1000),revision:!!parsed.revision};}}catch{}
                const request=new URL(`https://ranking.internal/api/filter?shop=${shop}&country=US&locale=en&sortBy=best-selling&page=1&collectionId=${number}&limit=25&responseProfile=collection-preview-v1`);
                const record=normalizeCollectionWarmup(shop,request.toString(),collection.id);
                const rankId='ranking-catalog-'+(await import('node:crypto')).createHash('sha256').update(record.url).digest('hex');
                const publishedKey=publishedCollectionKey(new Request(request));
                const rankJob=await ranking.getJob(rankId);
                const orderJob=await order.getJob(`collection-order-${encodeURIComponent(shop)}-${encodeURIComponent(collection.id)}`);
                const configRevision=await redis.get(`collectionPreparationRevision:${shop}`);
                console.log('COLLECTION_READY',JSON.stringify({handle:collection.handle,published:rows.map(row=>{const entry=decodePreparation(collectionSnapshotStorageText(row.payload));return {at:row.validatedAt,expires:row.expiresAt,size:row.size,usAlias:row.aliases.includes(publishedKey),configuration:entry.configuration,currentConfiguration:configRevision,marketVersion:entry.marketAvailabilityVersion??null,cardVersion:entry.cardPresentationVersion,products:entry.payload?.products?.length,facets:!!entry.payload?.facets};}),orderSnapshot:snapshot,rankJob:rankJob?{state:await rankJob.getState(),priority:rankJob.priority??rankJob.opts.priority,attempts:rankJob.attemptsMade,failedReason:rankJob.failedReason?.slice(0,160)}:null,orderJob:orderJob?{state:await orderJob.getState(),attempts:orderJob.attemptsMade,failedReason:orderJob.failedReason?.slice(0,160)}:null}));
              }
              console.log('QUEUE_COUNTS',JSON.stringify({ranking:await ranking.getJobCounts('active','waiting','prioritized','delayed','failed'),order:await order.getJobCounts('active','waiting','prioritized','delayed','failed')}));
              const failed=await order.getJobs(['failed'],0,9);
              console.log('ORDER_FAILURES',JSON.stringify(failed.map(job=>({attempts:job.attemptsMade,reason:job.failedReason?.replace(/https?:\S+/g,'[url]').slice(0,180)}))));
              for(const [name,queue] of [['ranking',ranking],['order',order]]){
                const active=await queue.getJobs(['active'],0,0);
                const first=await queue.getJobs(['prioritized'],0,0);
                console.log('QUEUE_HEAD',JSON.stringify({name,active:active.map(job=>({name:job.name,ageSeconds:Math.round((Date.now()-(job.processedOn||job.timestamp))/1000),attempts:job.attemptsMade,collectionId:job.data?.record?.collectionId||job.data?.collectionId})),first:first.map(job=>({name:job.name,priority:job.priority??job.opts.priority,ageSeconds:Math.round((Date.now()-job.timestamp)/1000),collectionId:job.data?.record?.collectionId||job.data?.collectionId}))}));
              }
            } finally {await Promise.allSettled([ranking.close(),order.close(),redis.quit(),db.$disconnect()]);}
            NODE
            docker logs --since 5m --tail 160 shopify-filter-sync-worker 2>&1 | grep -E 'collection preparation|Collection order|Collection publication|Periodic collection warmup|JSON|Error|error' | tail -40 || true

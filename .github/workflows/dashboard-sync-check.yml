name: Inspect collection audit storage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            df -h
            df -i
            docker system df
            sudo du -xhd1 /var/lib/docker 2>/dev/null | sort -h | tail -n 12
            docker ps --format '{{.Names}} {{.Size}}'

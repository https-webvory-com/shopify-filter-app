name: Inspect dashboard sync error
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker ps --format '{{.Names}} {{.Status}}'
            docker exec -i shopify-filter-app node --input-type=module <<'NODE'
            import {PrismaClient} from '@prisma/client';
            import meiliClient from './app/services/meiliClient.server.js';
            const db=new PrismaClient();
            try {
              const recentTasks=await meiliClient.tasks.getTasks({limit:100,indexUids:['products']});
              console.log('SALES_INDEX_TASKS',JSON.stringify(recentTasks.results?.slice(0,60).map(task=>({uid:task.uid,status:task.status,type:task.type,enqueuedAt:task.enqueuedAt}))));
              let lastId='',checked=0,mismatches=0;
              for(;;){
                const rows=await db.product.findMany({where:{shop:'thedressoutlet.myshopify.com',id:{gt:lastId}},orderBy:{id:'asc'},take:250,select:{id:true,bestSellingScore:true,trendingScore:true}});
                if(!rows.length)break;
                const ids=rows.map(row=>row.id.split('/').pop());
                const page=await meiliClient.index('products').getDocuments({filter:'id IN '+JSON.stringify(ids),fields:['id','shop','bestSellingScore','trendingScore'],limit:ids.length,offset:0});
                const indexed=new Map((page.results||[]).map(row=>[String(row.id),row]));
                for(let i=0;i<rows.length;i++){
                  const row=rows[i],doc=indexed.get(ids[i]);
                  if(!doc||doc.shop!=='thedressoutlet.myshopify.com'||Math.abs(Number(doc.bestSellingScore)-row.bestSellingScore)>0.001||Math.abs(Number(doc.trendingScore)-row.trendingScore)>0.001)mismatches++;
                }
                checked+=rows.length;lastId=rows.at(-1).id;
              }
              console.log('SALES_SCORE_VERIFY',JSON.stringify({checked,mismatches}));
              const salesSession=await db.session.findUnique({where:{id:'offline_thedressoutlet.myshopify.com'},select:{expires:true,refreshTokenExpires:true,refreshToken:true,scope:true}});
              console.log('SALES_SESSION_STATUS',JSON.stringify({expires:salesSession?.expires,refreshTokenExpires:salesSession?.refreshTokenExpires,hasRefreshToken:!!salesSession?.refreshToken,hasReadAllOrders:salesSession?.scope?.split(',').includes('read_all_orders')}));
              for(const shop of ['thedressoutlet.myshopify.com','thedressoutletuk.myshopify.com','another-shpyfy-store.myshopify.com']){
                const rows=await db.syncJob.findMany({where:{shop,kind:{in:['PRODUCTS','BULK_PRODUCTS']}},orderBy:{createdAt:'desc'},take:5,select:{id:true,kind:true,status:true,productsProcessed:true,totalProducts:true,createdAt:true,completedAt:true,updatedAt:true,lastError:true}});
                for(const row of rows)console.log('SYNC_JOB',JSON.stringify({...row,shop,lastError:row.lastError?.replace(/https?:\S+/g,'[url]').slice(0,350)}));
                const orderRows=await db.syncJob.findMany({where:{shop,OR:[{kind:'ORDERS'},{kind:null,totalProducts:null}]},orderBy:{createdAt:'desc'},take:3,select:{id:true,kind:true,status:true,productsProcessed:true,totalProducts:true,createdAt:true,completedAt:true,updatedAt:true,lastError:true}});
                for(const row of orderRows)console.log('ORDER_SYNC_JOB',JSON.stringify({...row,shop,lastError:row.lastError?.replace(/https?:\S+/g,'[url]').slice(0,350)}));
              }
            }finally{await db.$disconnect();}
            NODE
            docker inspect --format 'WEB_STATE {{.State.Status}} {{.RestartCount}} {{.State.OOMKilled}}' shopify-filter-app
            docker ps -a --format 'CONTAINER {{.ID}} {{.Names}} {{.Status}}'
            docker top shopify-filter-sync-worker
            docker exec shopify-filter-sync-worker sh -c 'echo WORKER_CGROUP_MEMORY; cat /sys/fs/cgroup/memory.events; cat /sys/fs/cgroup/memory.max'
            docker exec shopify-filter-sync-worker sh -c 'echo SALES_LOG_BYTES; wc -c /tmp/cfp-sales-sync-us.log; echo SALES_LOG_TAIL; tail -n 20 /tmp/cfp-sales-sync-us.log'
            docker exec shopify-filter-sync-worker sh -c 'echo SALES_LOG_EVENTS; grep -E "OrdersSync|Error|Killed|heap|FATAL" /tmp/cfp-sales-sync-us.log | tail -n 35'
            docker exec shopify-filter-sync-worker tail -n 15 /tmp/cfp-sales-sync-us.log
            docker logs --since 2026-11-04T12:00:00Z --tail 10000 shopify-filter-app 2>&1 | grep -E 'OrdersSync|Orders sync' | tail -100
            docker exec -i shopify-filter-app node --input-type=module <<'RECOVER'
            import {PrismaClient} from '@prisma/client';
            import meiliClient from './app/services/meiliClient.server.js';
            import {invalidateShop} from './app/services/shopCache.server.js';
            const db=new PrismaClient(),shop='thedressoutlet.myshopify.com',jobId='9d5821ed-3e0c-43dc-8c69-7a0e896c9e93';
            try{
              const job=await db.syncJob.findUnique({where:{id:jobId}});
              const latest=await db.syncJob.findFirst({where:{shop,kind:'ORDERS'},orderBy:{createdAt:'desc'},select:{id:true}});
              if(job?.shop!==shop||job.kind!=='ORDERS'||job.status!=='FAILED'||job.productsProcessed!==242397||latest?.id!==jobId)throw Error('Sales job state changed; recovery refused');
              for(let uid=835973;uid<=836024;uid++){
                const task=await meiliClient.tasks.getTask(uid);
                if(task.status!=='succeeded'||task.type!=='documentAdditionOrUpdate'||task.indexUid!=='products')throw Error('Sales index task '+uid+' is not a successful products update');
              }
              let lastId='',checked=0;
              for(;;){
                const rows=await db.product.findMany({where:{shop,id:{gt:lastId}},orderBy:{id:'asc'},take:250,select:{id:true,bestSellingScore:true,trendingScore:true}});
                if(!rows.length)break;
                const ids=rows.map(row=>row.id.split('/').pop());
                const page=await meiliClient.index('products').getDocuments({filter:'id IN '+JSON.stringify(ids),fields:['id','shop','bestSellingScore','trendingScore'],limit:ids.length,offset:0});
                const indexed=new Map((page.results||[]).map(row=>[String(row.id),row]));
                for(let i=0;i<rows.length;i++){
                  const row=rows[i],doc=indexed.get(ids[i]);
                  const score=Number(doc?.bestSellingScore),trend=Number(doc?.trendingScore);
                  if(doc?.shop!==shop||!Number.isFinite(score)||!Number.isFinite(trend)||Math.abs(score-row.bestSellingScore)>0.001||Math.abs(trend-row.trendingScore)>0.001)throw Error('Sales score mismatch for '+ids[i]);
                }
                checked+=rows.length;lastId=rows.at(-1).id;
              }
              if(checked!==51114)throw Error('US product count changed; recovery refused');
              console.log('SALES_RECOVERY_VERIFIED',JSON.stringify({orders:job.productsProcessed,products:checked,indexTasks:52}));
              await invalidateShop(shop,{kind:'scores'});
              const updated=await db.syncJob.updateMany({where:{id:jobId,shop,kind:'ORDERS',status:'FAILED',productsProcessed:242397},data:{status:'COMPLETED',completedAt:new Date(),lastError:null}});
              if(updated.count!==1)throw Error('Sales job state changed before finalization');
              console.log('SALES_SYNC_RECOVERED',JSON.stringify({jobId,orders:242397,products:checked}));
            }finally{await db.$disconnect();}
            RECOVER

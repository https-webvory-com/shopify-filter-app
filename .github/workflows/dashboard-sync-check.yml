name: Read-only scoped market price status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            docker exec -i shopify-filter-app node --input-type=module <<'NODE'
            import {PrismaClient} from '@prisma/client';
            import Redis from 'ioredis';
            import {Queue} from 'bullmq';
            import {Readable} from 'node:stream';
            import readline from 'node:readline';
            const prisma=new PrismaClient();
            const endpoint=new URL(process.env.REDIS_URL || 'redis://184.72.37.227:6379');
            if(!endpoint.password && process.env.REDIS_PASSWORD) endpoint.password=process.env.REDIS_PASSWORD;
            const redis=new Redis(endpoint.toString());
            const rankingQueue=new Queue('collectionRankingQueueV2',{connection:{host:endpoint.hostname,port:Number(endpoint.port||6379),...(endpoint.password?{password:decodeURIComponent(endpoint.password)}:{})}});
            const syncQueue=new Queue('productSyncQueue',{connection:{host:endpoint.hostname,port:Number(endpoint.port||6379),...(endpoint.password?{password:decodeURIComponent(endpoint.password)}:{})}});
            const shop='thedressoutlet.myshopify.com',country='IN';
            try{
              const [job,proof,backfill,rows,formalAudit,formalCounts,connection,marketSnapshot,published,publishedSample,publishedCount,rankingCounts,rankingJobs]=await Promise.all([
                prisma.syncJob.findFirst({where:{shop,kind:'BULK_PRODUCTS'},orderBy:{createdAt:'desc'},select:{id:true,status:true,createdAt:true,updatedAt:true,productsProcessed:true,totalProducts:true,lastError:true,cursor:true}}),
                redis.get(`marketPriceIntentReady:${shop}:${country}`),
                redis.ttl(`marketPriceBackfill:${shop}:${country}`),
                prisma.$queryRaw`SELECT count(v."id")::integer AS variants,count(v."id") FILTER (WHERE v."marketPrices" -> ${country} ->> 'price' IS NOT NULL)::integer AS priced FROM "Variant" v JOIN "Product" p ON p."id"=v."productId" WHERE p."shop"=${shop} AND lower(p."status")='active'`,
                redis.get(`membershipAuditStatus:${shop}:gid://shopify/Collection/409248522`),
                prisma.$queryRaw`SELECT count(*)::integer AS members,count(*) FILTER (WHERE lower(p."status")='active')::integer AS active,count(*) FILTER (WHERE lower(p."status")='active' AND EXISTS (SELECT 1 FROM "Variant" v WHERE v."productId"=p."id" AND v."available"=true))::integer AS available FROM "ProductCollection" pc JOIN "Product" p ON p."id"=pc."productId" WHERE pc."collectionId"='gid://shopify/Collection/409248522' AND p."shop"=${shop}`,
                prisma.marketStorefrontConnection.findUnique({where:{shop},select:{countries:true}}),
                prisma.marketAvailabilitySnapshot.findUnique({where:{shop_country:{shop,country}},select:{ids:true,updatedAt:true}}),
                prisma.collectionLoadingSnapshot.findMany({where:{shop,kind:'published',collectionId:'409248522'},orderBy:{validatedAt:'desc'},take:3,select:{validatedAt:true,expiresAt:true,size:true}}),
                prisma.collectionLoadingSnapshot.findFirst({where:{shop,kind:'published'},select:{collectionId:true,validatedAt:true}}),
                prisma.collectionLoadingSnapshot.count({where:{shop,kind:'published'}}),
                rankingQueue.getJobCounts('waiting','active','delayed','failed','completed'),
                rankingQueue.getJobs(['active','waiting','delayed'],0,5)
              ]);
              let bulkOperation=null;
              const queueJob=job?.id?await syncQueue.getJob(job.id):null;
              console.log('PRODUCT_SYNC_FAILURE',JSON.stringify({state:queueJob?await queueJob.getState():null,attemptsMade:queueJob?.attemptsMade,failedReason:queueJob?.failedReason,stacktrace:queueJob?.stacktrace?.slice(-3)}));
              const syncCounts=await syncQueue.getJobCounts('waiting','active','delayed','failed','completed');
              const activeSyncJobs=await syncQueue.getJobs(['active','waiting'],0,8);
              console.log('SYNC_QUEUE_STATUS',JSON.stringify({counts:syncCounts,jobs:activeSyncJobs.map(item=>({id:item.id,name:item.name,shop:item.data?.shop,operationId:!!item.data?.operationId,processedOn:item.processedOn,attemptsMade:item.attemptsMade,failedReason:item.failedReason}))}));
              if(job?.cursor){const session=await prisma.session.findFirst({where:{shop,isOnline:false},select:{accessToken:true}});if(session){const response=await fetch(`https://${shop}/admin/api/2025-10/graphql.json`,{method:'POST',headers:{'Content-Type':'application/json','X-Shopify-Access-Token':session.accessToken},body:JSON.stringify({query:'query($id:ID!){bulkOperation(id:$id){status errorCode rootObjectCount objectCount url}}',variables:{id:job.cursor}}),signal:AbortSignal.timeout(10000)});const operation=(await response.json()).data?.bulkOperation;bulkOperation=operation?{...operation,url:undefined}:{httpStatus:response.status};if(operation?.url){const stream=await fetch(operation.url,{signal:AbortSignal.timeout(240000)});const lines=readline.createInterface({input:Readable.fromWeb(stream.body),crlfDelay:Infinity});let root=0;for await(const line of lines){if(!line.trim())continue;const row=JSON.parse(line);if(row.__parentId)continue;root++;if(root<job.productsProcessed)continue;const shape={root,id:row.id,status:row.status,titleType:typeof row.title,handleType:typeof row.handle,keys:Object.keys(row)};if(root<=job.productsProcessed+3)console.log('BULK_ROOT_SHAPE',JSON.stringify(shape));if(!/^gid:\/\/shopify\/Product\/\d+$/.test(row.id||'')||!['ACTIVE','DRAFT','ARCHIVED'].includes(row.status)||typeof row.title!=='string'||typeof row.handle!=='string'){console.log('INVALID_BULK_ROOT',JSON.stringify(shape));break;}if(root>job.productsProcessed+1000){console.log('BULK_ROOT_SCAN_LIMIT',root);break;}}}}}
              console.log('MARKET_PRICE_STATUS',JSON.stringify({job:{...job,cursor:undefined},bulkOperation,ready:!!proof,backfillTtl:backfill,coverage:rows[0],formalAudit:formalAudit?JSON.parse(formalAudit):null,formalCounts:formalCounts[0],connectionCountries:connection?.countries||[],marketSnapshot:marketSnapshot?{ids:marketSnapshot.ids.length,updatedAt:marketSnapshot.updatedAt}:null,published,publishedSample,publishedCount,rankingCounts,rankingJobs:rankingJobs.map(j=>({name:j.name,collectionId:j.data?.record?.collectionId||j.data?.spec?.collectionId||null,processedOn:j.processedOn,attemptsMade:j.attemptsMade,failedReason:String(j.failedReason||'').slice(0,100)}))}));
            }finally{await prisma.$disconnect();await rankingQueue.close();await syncQueue.close();redis.disconnect();}
            NODE
            docker logs --since 10m shopify-filter-sync-worker 2>&1 | grep -E 'Market price coverage|market price coverage|BULK_PRODUCTS|catalog drift scheduler|Optional collection cards warmup|Available option facet counts|collection cards ready|Collection catalog cards' | tail -35 || true
            docker logs --since 5m shopify-filter-app 2>&1 | grep -E 'Available option facet counts|Collection ranking|CFP.*Error|CFP.*error|timeout' | tail -30 || true
            docker logs --since 30m shopify-filter-sync-worker 2>&1 | grep -i -E 'sync.*(fail|error)|bulk.*(fail|error)|Product sync|error processing' | tail -60 || true
            docker ps --format '{{.Names}} {{.Status}}' | grep -E 'shopify-filter-app|shopify-filter-sync-worker' || true

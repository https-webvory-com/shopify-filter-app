name: Inspect collection audit worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker exec -i shopify-filter-app node --input-type=module <<'NODE'
            import {Queue} from 'bullmq';
            import {redisOptions} from './app/services/queue.server.js';
            import meili from './app/services/meiliClient.server.js';
            const q=new Queue('collectionMembershipQueueV1',{connection:redisOptions});
            try {
              const id='membership-target-fa00634d440b466102797cbbd5d2de352ab7646f2e52613a21690b2ade303a00';
              const job=await q.getJob(id);
              console.log('TARGET_AUDIT',JSON.stringify(job?{state:await job.getState(),attempts:job.attemptsMade,reason:String(job.failedReason||'').slice(0,250)}:{state:'missing'}));
              console.log('QUEUE_COUNTS',JSON.stringify(await q.getJobCounts('active','waiting','delayed','failed','completed')));
              for(const id of [744122,744127,744130,744133]){const task=await meili.tasks.getTask(id);console.log('MEILI_TASK',JSON.stringify({id,status:task.status,type:task.type,error:task.error?.message?.slice(0,180),duration:task.duration}));}
              const tasks=await meili.tasks.getTasks({limit:10});console.log('MEILI_RECENT',JSON.stringify(tasks.results.map(t=>({id:t.uid,status:t.status,type:t.type,error:t.error?.message?.slice(0,100)}))));
              const failed=await meili.tasks.getTask(744122);console.log('EMBEDDING_FAILURE',JSON.stringify({error:failed.error?.message?.replace(/https?:\/\/[^\s"']+/g,'[url]').slice(0,800)}));
              console.log('EMBEDDING_ENV',JSON.stringify({provider:process.env.SEMANTIC_EMBEDDING_PROVIDER,openaiKey:!!process.env.OPENAI_API_KEY,relayUrl:!!process.env.SEMANTIC_RELAY_URL,relayToken:!!process.env.SEMANTIC_RELAY_TOKEN,autoSetup:process.env.SEMANTIC_EMBEDDING_SETUP_ENABLED}));
            } finally {await q.close();process.exit(0);}
            NODE

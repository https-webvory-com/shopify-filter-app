name: Inspect collection audit worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker logs --since 8m shopify-filter-sync-worker 2>&1 | grep -E 'Collection membership reconciliation|membership-target|Market price coverage|No space left|MeilisearchApiError' | tail -n 55
            docker ps --format '{{.Names}} {{.Status}}'

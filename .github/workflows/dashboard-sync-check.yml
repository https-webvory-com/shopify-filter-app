name: Read-only audit price backfill status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 3m
          script: |
            docker exec -i shopify-filter-app node --input-type=module <<'NODE'
            import {PrismaClient} from '@prisma/client';
            import Redis from 'ioredis';
            import {Queue} from 'bullmq';
            const db=new PrismaClient();
            const endpoint=new URL(process.env.REDIS_URL || 'redis://184.72.37.227:6379');
            if(!endpoint.password&&process.env.REDIS_PASSWORD)endpoint.password=process.env.REDIS_PASSWORD;
            const redis=new Redis(endpoint.toString());
            const queue=new Queue('productSyncQueue',{connection:redis});
            const shop='thedressoutlet.myshopify.com',country='IN';
            try{
              const [job,proof,counts]=await Promise.all([
                db.syncJob.findFirst({where:{shop,kind:'BULK_PRODUCTS'},orderBy:{createdAt:'desc'},select:{id:true,status:true,productsProcessed:true,totalProducts:true,updatedAt:true,lastError:true}}),
                redis.get(`marketPriceIntentReady:${shop}:${country}`),
                db.$queryRaw`SELECT count(v."id")::integer AS variants,count(v."id") FILTER (WHERE v."marketPrices" -> ${country} ->> 'price' IS NOT NULL)::integer AS priced FROM "Variant" v JOIN "Product" p ON p."id"=v."productId" WHERE p."shop"=${shop} AND lower(p."status")='active'`
              ]);
              const queued=job?await queue.getJob(job.id):null;
              const active=await queue.getJobs(['active'],0,4);
              console.log('AUDIT_PRICE_STATUS',JSON.stringify({job,coverage:counts[0],proofReady:!!proof,queue:queued?{state:await queued.getState(),attemptsMade:queued.attemptsMade,processedOn:queued.processedOn,finishedOn:queued.finishedOn,failedReason:String(queued.failedReason||'').slice(0,500)}:null,activeJobs:active.map(item=>({id:item.id,name:item.name,shop:item.data?.shop,processedOn:item.processedOn}))}));
              const sample=await db.$queryRaw`SELECT p."id" AS "productId",p."title",p."priceMin" AS "baseProductMin",v."id" AS "variantId",v."price" AS "baseVariantPrice",v."available",v."marketPrices" -> 'IN' AS "india",v."marketPrices" -> 'US' AS "unitedStates" FROM "Variant" v JOIN "Product" p ON p."id"=v."productId" WHERE p."shop"=${shop} AND lower(p."status")='active' AND v."marketPrices" -> 'IN' ->> 'price' IS NOT NULL ORDER BY p."id",v."id" LIMIT 1`;
              console.log('AUDIT_MARKET_PRICE_SAMPLE',JSON.stringify(sample[0]||null));
            }finally{await queue.close();await db.$disconnect();redis.disconnect();}
            NODE
            docker stats --no-stream --format 'AUDIT_WORKER_MEMORY {{.MemUsage}}' shopify-filter-sync-worker
            docker exec -i shopify-filter-app node --input-type=module <<'NODE'
            import {PrismaClient} from '@prisma/client';
            import {Readable} from 'node:stream';
            import readline from 'node:readline';
            const db=new PrismaClient();
            const shop='thedressoutlet.myshopify.com';
            try{
              const job=await db.syncJob.findFirst({where:{shop,kind:'BULK_PRODUCTS'},orderBy:{createdAt:'desc'},select:{cursor:true,productsProcessed:true,status:true}});
              if(job?.status==='FAILED'&&job.cursor){
                const session=await db.session.findFirst({where:{shop,isOnline:false},select:{accessToken:true}});
                if(!session)throw Error('Offline session unavailable');
                const response=await fetch(`https://${shop}/admin/api/2025-10/graphql.json`,{method:'POST',headers:{'Content-Type':'application/json','X-Shopify-Access-Token':session.accessToken},body:JSON.stringify({query:'query($id:ID!){bulkOperation(id:$id){status url}}',variables:{id:job.cursor}}),signal:AbortSignal.timeout(15000)});
                const operation=(await response.json()).data?.bulkOperation;
                console.log('AUDIT_BULK_OPERATION',JSON.stringify({status:operation?.status||null,hasUrl:!!operation?.url,checkpoint:job.productsProcessed}));
                if(operation?.status==='COMPLETED'&&operation.url){
                  const download=await fetch(operation.url,{signal:AbortSignal.timeout(90000)});
                  if(!download.ok)throw Error('Bulk export unavailable');
                  let root=0,productId='',printed=0;
                  for await(const line of readline.createInterface({input:Readable.fromWeb(download.body),crlfDelay:Infinity})){
                    if(!line.trim())continue;
                    const row=JSON.parse(line);
                    if(!row.__parentId){root++;productId=row.id;if(root>job.productsProcessed+200)break;continue;}
                    if(root<=job.productsProcessed||!String(row.id||'').startsWith('gid://shopify/ProductVariant/'))continue;
                    const value=row.cfpMarket_IN;
                    const amount=value?.price?.amount==null?NaN:Number(value.price.amount),currency=value?.price?.currencyCode,compare=value?.compareAtPrice?.amount==null?null:Number(value.compareAtPrice.amount);
                    if(!Number.isFinite(amount)||amount<0||!/^[A-Z]{3}$/.test(currency||'')||(compare!==null&&(!Number.isFinite(compare)||compare<0||value.compareAtPrice.currencyCode!==currency))){
                      console.log('AUDIT_MISSING_MARKET_PRICE',JSON.stringify({root,productId,variantId:row.id,price:value?.price||null,compareAtPrice:value?.compareAtPrice||null,basePrice:row.price,availableForSale:row.availableForSale}));
                      if(++printed>=5)break;
                    }
                  }
                  console.log('AUDIT_BULK_SCAN',JSON.stringify({roots:root,missingPrinted:printed}));
                }
              }
            }finally{await db.$disconnect();}
            NODE

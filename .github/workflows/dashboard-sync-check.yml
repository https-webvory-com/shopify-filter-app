name: Read-only collection readiness audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker exec -i shopify-filter-app node --input-type=module <<'NODE'
            import {PrismaClient} from '@prisma/client';
            import Redis from 'ioredis';
            import {Queue} from 'bullmq';
            import {redisConnectionOptions} from './app/services/redisConnection.server.js';
            import {normalizeCollectionWarmup} from './app/utils/collectionPreparation.js';
            import {publishedCollectionKey} from './app/utils/collectionPublishedPage.js';
            import {decodePreparation} from './app/utils/collectionPreparationPayload.js';
            import {collectionSnapshotStorageText} from './app/utils/collectionLoadingSnapshots.js';
            const shop='thedressoutlet.myshopify.com';
            const handles=['formal-dresses','beach-wedding-guest-dresses','cocktail-dresses'];
            const db=new PrismaClient();
            const redis=new Redis(redisConnectionOptions);
            const ranking=new Queue('collectionRankingQueueV2',{connection:redisConnectionOptions});
            const order=new Queue('collectionOrderQueueV1',{connection:redisConnectionOptions});
            try {
              const collections=await db.collection.findMany({where:{shop,handle:{in:handles}},select:{id:true,handle:true}});
              const allPublished=await db.collectionLoadingSnapshot.count({where:{shop,kind:'published',expiresAt:{gt:new Date()}}});
              console.log('PUBLICATION_TOTAL',allPublished);
              console.log('CONFIG_REVISION',JSON.stringify({revision:await redis.get(`collectionPreparationRevision:${shop}`),invalidatedAt:await redis.get(`collectionConfigurationInvalidatedAt:${shop}`)}));
              const settings=await db.filterGlobalSetting.findUnique({where:{shop},select:{updatedAt:true,showFilterOptionsWithOneItem:true,showOnlyInStock:true,prioritizeSortOverPinning:true,prioritizeSortOverMerchandising:true}});
              const groups=await db.filterGroup.findMany({where:{shop},select:{name:true,updatedAt:true},orderBy:{updatedAt:'desc'},take:3});
              console.log('CONFIG_UPDATES',JSON.stringify({settings,groups}));
              for(const collection of collections){
                const number=collection.id.split('/').pop();
                const rows=await db.collectionLoadingSnapshot.findMany({where:{shop,kind:'published',collectionId:{in:[collection.id,number]}},select:{aliases:true,validatedAt:true,expiresAt:true,size:true,payload:true},orderBy:{validatedAt:'desc'},take:5});
                const raw=await redis.get(`collectionOrderSnapshot:${shop}:${collection.id}`);
                let snapshot=null;try{if(raw){const parsed=JSON.parse(raw);snapshot={count:parsed.ids?.length,ageSeconds:Math.round((Date.now()-parsed.updatedAt)/1000),revision:!!parsed.revision};}}catch{}
                const request=new URL(`https://ranking.internal/api/filter?shop=${shop}&country=US&locale=en&sortBy=best-selling&page=1&collectionId=${number}&limit=25&responseProfile=collection-preview-v1`);
                const record=normalizeCollectionWarmup(shop,request.toString(),collection.id);
                const rankId='ranking-catalog-'+(await import('node:crypto')).createHash('sha256').update(record.url).digest('hex');
                const publishedKey=publishedCollectionKey(new Request(request));
                const rankJob=await ranking.getJob(rankId);
                const orderJob=await order.getJob(`collection-order-${encodeURIComponent(shop)}-${encodeURIComponent(collection.id)}`);
                const configRevision=await redis.get(`collectionPreparationRevision:${shop}`);
                console.log('COLLECTION_READY',JSON.stringify({handle:collection.handle,published:rows.map(row=>{const entry=decodePreparation(collectionSnapshotStorageText(row.payload));return {at:row.validatedAt,expires:row.expiresAt,size:row.size,usAlias:row.aliases.includes(publishedKey),configuration:entry.configuration,currentConfiguration:configRevision,marketVersion:entry.marketAvailabilityVersion??null,cardVersion:entry.cardPresentationVersion,products:entry.payload?.products?.length,facets:!!entry.payload?.facets};}),orderSnapshot:snapshot,rankJob:rankJob?{state:await rankJob.getState(),priority:rankJob.priority??rankJob.opts.priority,attempts:rankJob.attemptsMade,failedReason:rankJob.failedReason?.slice(0,160)}:null,orderJob:orderJob?{state:await orderJob.getState(),attempts:orderJob.attemptsMade,failedReason:orderJob.failedReason?.slice(0,160)}:null}));
              }
              console.log('QUEUE_COUNTS',JSON.stringify({ranking:await ranking.getJobCounts('active','waiting','prioritized','delayed','failed'),order:await order.getJobCounts('active','waiting','prioritized','delayed','failed')}));
              const failed=await order.getJobs(['failed'],0,9);
              console.log('ORDER_FAILURES',JSON.stringify(failed.map(job=>({attempts:job.attemptsMade,reason:job.failedReason?.replace(/https?:\S+/g,'[url]').slice(0,180)}))));
            } finally {await Promise.allSettled([ranking.close(),order.close(),redis.quit(),db.$disconnect()]);}
            NODE

name: Hold unavailable semantic embeddings
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            python3 - <<'PY'
            from pathlib import Path
            import os,secrets,tempfile
            path=Path('/home/ubuntu/shopify-filter-app/.env')
            if not path.is_file():raise SystemExit('App environment missing')
            existing=path.read_text().splitlines()
            if not any(line.startswith('OPENAI_API_KEY=') for line in existing):raise SystemExit('Existing provider key missing')
            updates={
              'SEMANTIC_SEARCH_ENABLED':'false',
              'SEMANTIC_EMBEDDING_REGENERATION_ENABLED':'false',
              'SEMANTIC_RELAY_TOKEN':secrets.token_hex(32),
            }
            lines=[line for line in existing if line.split('=',1)[0] not in updates]
            lines.extend(key+'='+value for key,value in updates.items())
            fd,name=tempfile.mkstemp(prefix='.env.',dir=path.parent,text=True)
            with os.fdopen(fd,'w') as target:target.write('\n'.join(lines)+'\n')
            os.chmod(name,0o600)
            os.replace(name,path)
            print('EMBEDDING_HOLD_CONFIGURED', 'semantic=false', 'regeneration=false', 'relay_token=rotated')
            PY

name: Apply authorized saved configuration version
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 6m
          script: |
            set -eu
            umask 077
            backup_root="$HOME/.local/state/shopify-filter-app/backups/cfp-saved-version-20261111-497"
            cd "$backup_root"
            sha256sum -c SHA256SUMS > /dev/null
            expected_plan=$(sha256sum plan.json | cut -d ' ' -f 1)
            actual_plan=$(docker exec shopify-filter-app sha256sum /tmp/cfp-saved-version-20261111-497/plan.json | cut -d ' ' -f 1)
            test "$expected_plan" = "$actual_plan"
            printf '%s' '' | base64 -d | docker exec -i -w /app shopify-filter-app node --input-type=module
            docker exec -w /app shopify-filter-app node /tmp/cfp-saved-version-20261111-497/repair.mjs apply
            docker cp shopify-filter-app:/tmp/cfp-saved-version-20261111-497/result.json "$backup_root/result.json"
            sha256sum result.json > APPLIED_RESULT_SHA256
            echo SAVED_VERSION_UPDATE_COMPLETED

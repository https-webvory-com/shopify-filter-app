name: Prepare authorized saved version update
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 6m
          script: |
            set -eu
            umask 077
            backup_root="$HOME/.local/state/shopify-filter-app/backups"
            install -d -m 700 "$backup_root"
            test ! -e "$backup_root/cfp-saved-version-20261111-497"
            test "$(df -Pm "$backup_root" | awk 'NR==2 {print $4}')" -gt 1024
            printf '%s' '' | base64 -d | docker exec -i shopify-filter-app sh -c 'umask 077; mkdir -p /tmp/cfp-saved-version-20261111-497; cat > /tmp/cfp-saved-version-20261111-497/repair.mjs'
            docker exec -w /app shopify-filter-app node /tmp/cfp-saved-version-20261111-497/repair.mjs prepare
            docker cp shopify-filter-app:/tmp/cfp-saved-version-20261111-497 "$backup_root/"
            chmod -R go-rwx "$backup_root/cfp-saved-version-20261111-497"
            cd "$backup_root/cfp-saved-version-20261111-497"
            find objects -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum plan.json repair.mjs >> SHA256SUMS
            sha256sum -c SHA256SUMS > /dev/null
            echo BACKUP_VERIFIED "$backup_root/cfp-saved-version-20261111-497"

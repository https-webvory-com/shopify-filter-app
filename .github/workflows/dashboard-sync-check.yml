name: Read-only audit price backfill status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 3m
          script: |
            docker exec -i shopify-filter-app node --input-type=module <<'NODE'
            import {PrismaClient} from '@prisma/client';
            import Redis from 'ioredis';
            import {Queue} from 'bullmq';
            const db=new PrismaClient();
            const endpoint=new URL(process.env.REDIS_URL || 'redis://184.72.37.227:6379');
            if(!endpoint.password&&process.env.REDIS_PASSWORD)endpoint.password=process.env.REDIS_PASSWORD;
            const redis=new Redis(endpoint.toString());
            const queue=new Queue('productSyncQueue',{connection:redis});
            const shop='thedressoutlet.myshopify.com',country='IN';
            try{
              const [job,proof,counts]=await Promise.all([
                db.syncJob.findFirst({where:{shop,kind:'BULK_PRODUCTS'},orderBy:{createdAt:'desc'},select:{id:true,status:true,productsProcessed:true,totalProducts:true,updatedAt:true,lastError:true}}),
                redis.get(`marketPriceIntentReady:${shop}:${country}`),
                db.$queryRaw`SELECT count(v."id")::integer AS variants,count(v."id") FILTER (WHERE v."marketPrices" -> ${country} ->> 'price' IS NOT NULL)::integer AS priced FROM "Variant" v JOIN "Product" p ON p."id"=v."productId" WHERE p."shop"=${shop} AND lower(p."status")='active'`
              ]);
              const queued=job?await queue.getJob(job.id):null;
              const active=await queue.getJobs(['active'],0,4);
              console.log('AUDIT_PRICE_STATUS',JSON.stringify({job,coverage:counts[0],proofReady:!!proof,queue:queued?{state:await queued.getState(),attemptsMade:queued.attemptsMade,processedOn:queued.processedOn,finishedOn:queued.finishedOn,failedReason:String(queued.failedReason||'').slice(0,500)}:null,activeJobs:active.map(item=>({id:item.id,name:item.name,shop:item.data?.shop,processedOn:item.processedOn}))}));
              const sample=await db.$queryRaw`SELECT p."id" AS "productId",p."title",p."priceMin" AS "baseProductMin",v."id" AS "variantId",v."price" AS "baseVariantPrice",v."available",v."marketPrices" -> 'IN' AS "india",v."marketPrices" -> 'US' AS "unitedStates" FROM "Variant" v JOIN "Product" p ON p."id"=v."productId" WHERE p."shop"=${shop} AND lower(p."status")='active' AND v."marketPrices" -> 'IN' ->> 'price' IS NOT NULL ORDER BY p."id",v."id" LIMIT 1`;
              console.log('AUDIT_MARKET_PRICE_SAMPLE',JSON.stringify(sample[0]||null));
            }finally{await queue.close();await db.$disconnect();redis.disconnect();}
            NODE
            docker stats --no-stream --format 'AUDIT_WORKER_MEMORY {{.MemUsage}}' shopify-filter-sync-worker

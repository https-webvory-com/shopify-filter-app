name: Inspect dashboard sync error
on:
  workflow_dispatch:
    inputs:
      search_rules:
        description: Read search-rule update state and errors only
        type: boolean
        default: false
      retire_abandoned_index:
        description: Optional already-queued unused temporary build to retire before retrying incremental rules
        type: string
        default: ''
      repair_policy_checkpoint:
        description: Clear a legacy comparison checkpoint only for a verified field-weight-only saved rule
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        env:
          CHECK_SEARCH_RULES: ${{ inputs.search_rules }}
          RETIRE_ABANDONED_INDEX: ${{ inputs.retire_abandoned_index }}
          REPAIR_POLICY_CHECKPOINT: ${{ inputs.repair_policy_checkpoint }}
        with:
          envs: CHECK_SEARCH_RULES,RETIRE_ABANDONED_INDEX,REPAIR_POLICY_CHECKPOINT
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ "$CHECK_SEARCH_RULES" = true ]; then
              docker exec -i -e RETIRE_ABANDONED_INDEX -e REPAIR_POLICY_CHECKPOINT shopify-filter-app node --input-type=module <<'SEARCH_NODE'
            import {PrismaClient} from '@prisma/client';
            import {Queue} from 'bullmq';
            import {redisConnectionOptions} from './app/services/redisConnection.server.js';
            import client from './app/services/meiliClient.server.js';
            const db=new PrismaClient(),queue=new Queue('searchIndexQueueV1',{connection:redisConnectionOptions});
            const shop='thedressoutlet.myshopify.com';
            const clean=value=>String(value||'').replace(/https?:\/\/\S+/g,'[url]').slice(0,1800);
            try {
              const row=await db.searchSetting.findUnique({where:{shop}}),state=row?.config?._index||{};
              console.log('SEARCH_RULE_STATE',JSON.stringify({phase:state.phase,processed:state.processed,total:state.total,error:state.error,active:state.active?.uid,build:state.build?.uid,incremental:!!state.update,updated:state.update?.updated,lastUpdate:state.lastUpdate,queryRanking:state.active?.queryRanking,activeWeights:state.active?.config?.fields?.filter(field=>['title','handle'].includes(field.key)).map(({key,weight})=>({key,weight}))}));
              console.log('SEARCH_RULE_CHECKPOINT',JSON.stringify({forceScan:state.update?.forceScan,forceFields:state.update?.forceFields,applied:state.update?.applied}));
              if(process.env.REPAIR_POLICY_CHECKPOINT==='true'){
                const {validateSearchSettings}=await import('./app/utils/searchSettings.js');
                const {searchIndexConfiguration}=await import('./app/utils/searchConfiguration.js');
                const signature=value=>{const config=validateSearchSettings(value);return JSON.stringify({...searchIndexConfiguration(config),fields:config.fields.map(({weight,search,suggest,...field})=>field)});};
                if(!state.active?.uid||state.build||!state.update?.forceScan||state.update.forceFields?.length)throw Error('Not a repairable legacy policy checkpoint');
                if(signature(state.update.from)!==signature(row.config)||signature(state.update.from)!==signature(state.update.config))throw Error('Document transformations are pending; refusing policy checkpoint repair');
                const repaired=await db.searchSetting.updateMany({where:{shop,updatedAt:row.updatedAt},data:{config:{...row.config,_index:{...state,update:{...state.update,forceScan:false}}}}});
                if(repaired.count!==1)throw Error('Saved rule changed during checkpoint repair');
                const {scheduleSearchIndex}=await import('./app/services/searchIndex.server.js');await scheduleSearchIndex(shop,{allowInitialBuild:false});
                const ready=(await db.searchSetting.findUnique({where:{shop}})).config._index;
                console.log('POLICY_CHECKPOINT_REPAIRED',JSON.stringify({phase:ready.phase,active:ready.active?.uid,build:ready.build?.uid,update:!!ready.update,queryRanking:ready.active?.queryRanking,lastUpdate:ready.lastUpdate}));
              }
              const jobs=await queue.getJobs(['active','failed','delayed','prioritized'],0,60);
              for(const job of jobs)if(job.data.shop===shop&&(job.data.incremental||job.data.retireUid))console.log('SEARCH_RULE_JOB',JSON.stringify({name:job.name,state:await job.getState(),retireUid:job.data.retireUid,incremental:job.data.incremental,error:clean(job.failedReason),stack:clean(job.stacktrace?.at(-1))}));
              const prefix=state.active?.uid?.slice(0,28);
              const all=await client.getIndexes({limit:1000});
              for(const item of all.results.filter(item=>prefix&&item.uid.startsWith(prefix))){const index=client.index(item.uid),stats=await index.getStats(),info=await index.getRawInfo();console.log('SEARCH_INDEX_STORAGE',JSON.stringify({uid:item.uid,createdAt:info.createdAt,documents:stats.numberOfDocuments,isIndexing:stats.isIndexing,active:item.uid===state.active?.uid,build:item.uid===state.build?.uid}));}
              const global=await client.getStats();console.log('SEARCH_STORAGE_TOTAL',JSON.stringify({databaseSize:global.databaseSize,usedDatabaseSize:global.usedDatabaseSize}));
              const target=process.env.RETIRE_ABANDONED_INDEX;
              if(target){
                if(!prefix||!target.startsWith(prefix)||target===state.active?.uid||target===state.build?.uid)throw Error('Refusing to retire a serving or building index');
                if(!jobs.some(job=>job.data.shop===shop&&job.data.retireUid===target))throw Error('Index is not already queued for retirement');
                const owners=await db.searchSetting.findMany({select:{config:true}});
                if(owners.some(owner=>[owner.config?._index?.active?.uid,owner.config?._index?.build?.uid].includes(target)))throw Error('Index is referenced by saved settings');
                const info=await client.index(target).getRawInfo(),stats=await client.index(target).getStats(),serving=await client.index(state.active.uid).getStats();
                const createdAt=new Date(info.createdAt).getTime();
                if(!Number.isFinite(createdAt)||createdAt<new Date('2026-11-18T00:00:00Z').getTime()||stats.numberOfDocuments>=serving.numberOfDocuments)throw Error('Only this session\'s incomplete temporary build can be retired');
                const task=await client.deleteIndex(target),done=await client.tasks.waitForTask(task.taskUid,{timeout:120000});
                if(done.status!=='succeeded')throw Error('Temporary index retirement failed: '+done.error?.code);
                console.log('ABANDONED_BUILD_RETIRED',JSON.stringify({uid:target,documents:stats.numberOfDocuments,activePreserved:state.active.uid}));
                const {scheduleSearchIndex}=await import('./app/services/searchIndex.server.js');await scheduleSearchIndex(shop,{allowInitialBuild:false});
                console.log('INCREMENTAL_RULE_RETRY_QUEUED');
                setTimeout(()=>process.exit(0),2000).unref();
              }
              if(state.active?.uid){const tasks=await client.tasks.getTasks({indexUids:[state.active.uid],limit:8});for(const task of tasks.results)console.log('SEARCH_RULE_ENGINE_TASK',JSON.stringify({uid:task.uid,type:task.type,status:task.status,errorCode:task.error?.code,error:clean(task.error?.message)}));}
            }finally{await queue.close();await db.$disconnect();}
            SEARCH_NODE
              exit $?
            fi
            docker ps --format '{{.Names}} {{.Status}}'
            docker exec -i shopify-filter-app node --input-type=module <<'NODE'
            import {PrismaClient} from '@prisma/client';
            import {Queue} from 'bullmq';
            import {redisOptions,webhookQueue} from './app/services/queue.server.js';
            import meiliClient from './app/services/meiliClient.server.js';
            const db=new PrismaClient(); const queue=new Queue('productSyncQueue',{connection:redisOptions});
            try {
              const stats=await meiliClient.index('products').getStats();
              const embedders=(await meiliClient.index('products').getSettings()).embedders || {};
              const embeddingTask=await meiliClient.tasks.getTask(252811);
              console.log('SEARCH_ENGINE_STATUS',JSON.stringify({documents:stats.numberOfDocuments,isIndexing:stats.isIndexing,embedders:Object.keys(embedders),embeddingTask:embeddingTask.status,autoEmbeddingSetup:process.env.SEMANTIC_EMBEDDING_SETUP_ENABLED==='true'}));
              for(const shop of ['thedressoutlet.myshopify.com','another-shpyfy-store.myshopify.com']){
                const rows=await db.syncJob.findMany({where:{shop,kind:'PRODUCTS'},orderBy:{createdAt:'desc'},take:3,select:{id:true,status:true,productsProcessed:true,totalProducts:true,completedAt:true,updatedAt:true,lastError:true}});
                for(const row of rows){const queued=await queue.getJob(row.id);console.log('SYNC_JOB',JSON.stringify({...row,shop,queueState:queued?await queued.getState():'missing',lastError:row.lastError?.replace(/https?:\S+/g,'[url]').slice(0,350)}));}
              }
            }finally{await queue.close();await webhookQueue.close();await db.$disconnect();}
            NODE

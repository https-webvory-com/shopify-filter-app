name: Inspect dashboard sync error
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker ps --format '{{.Names}} {{.Status}}'
            docker exec -i shopify-filter-app node --input-type=module <<'NODE'
            import {PrismaClient} from '@prisma/client';
            import meiliClient from './app/services/meiliClient.server.js';
            const db=new PrismaClient();
            try {
              const recentTasks=await meiliClient.tasks.getTasks({limit:100,indexUids:['products']});
              console.log('SALES_INDEX_TASKS',JSON.stringify(recentTasks.results?.slice(0,60).map(task=>({uid:task.uid,status:task.status,type:task.type,enqueuedAt:task.enqueuedAt}))));
              const salesSession=await db.session.findUnique({where:{id:'offline_thedressoutlet.myshopify.com'},select:{expires:true,refreshTokenExpires:true,refreshToken:true,scope:true}});
              console.log('SALES_SESSION_STATUS',JSON.stringify({expires:salesSession?.expires,refreshTokenExpires:salesSession?.refreshTokenExpires,hasRefreshToken:!!salesSession?.refreshToken,hasReadAllOrders:salesSession?.scope?.split(',').includes('read_all_orders')}));
              for(const shop of ['thedressoutlet.myshopify.com','thedressoutletuk.myshopify.com','another-shpyfy-store.myshopify.com']){
                const rows=await db.syncJob.findMany({where:{shop,kind:{in:['PRODUCTS','BULK_PRODUCTS']}},orderBy:{createdAt:'desc'},take:5,select:{id:true,kind:true,status:true,productsProcessed:true,totalProducts:true,createdAt:true,completedAt:true,updatedAt:true,lastError:true}});
                for(const row of rows)console.log('SYNC_JOB',JSON.stringify({...row,shop,lastError:row.lastError?.replace(/https?:\S+/g,'[url]').slice(0,350)}));
                const orderRows=await db.syncJob.findMany({where:{shop,OR:[{kind:'ORDERS'},{kind:null,totalProducts:null}]},orderBy:{createdAt:'desc'},take:3,select:{id:true,kind:true,status:true,productsProcessed:true,totalProducts:true,createdAt:true,completedAt:true,updatedAt:true,lastError:true}});
                for(const row of orderRows)console.log('ORDER_SYNC_JOB',JSON.stringify({...row,shop,lastError:row.lastError?.replace(/https?:\S+/g,'[url]').slice(0,350)}));
              }
            }finally{await db.$disconnect();}
            NODE
            docker inspect --format 'WEB_STATE {{.State.Status}} {{.RestartCount}} {{.State.OOMKilled}}' shopify-filter-app
            docker ps -a --format 'CONTAINER {{.ID}} {{.Names}} {{.Status}}'
            docker top shopify-filter-sync-worker
            docker exec shopify-filter-sync-worker sh -c 'echo WORKER_CGROUP_MEMORY; cat /sys/fs/cgroup/memory.events; cat /sys/fs/cgroup/memory.max'
            docker exec shopify-filter-sync-worker sh -c 'echo SALES_LOG_BYTES; wc -c /tmp/cfp-sales-sync-us.log; echo SALES_LOG_TAIL; tail -n 20 /tmp/cfp-sales-sync-us.log'
            docker exec shopify-filter-sync-worker sh -c 'echo SALES_LOG_EVENTS; grep -E "OrdersSync|Error|Killed|heap|FATAL" /tmp/cfp-sales-sync-us.log | tail -n 35'
            docker exec shopify-filter-sync-worker tail -n 15 /tmp/cfp-sales-sync-us.log
            docker logs --since 2026-11-04T12:00:00Z --tail 10000 shopify-filter-app 2>&1 | grep -E 'OrdersSync|Orders sync' | tail -100

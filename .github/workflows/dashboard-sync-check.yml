name: Inspect live background workers read only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            docker ps --format '{{.Names}} {{.Status}}'
            docker stats --no-stream --format '{{.Name}} CPU={{.CPUPerc}} Memory={{.MemUsage}}'
            docker inspect --format 'WORKER RestartCount={{.RestartCount}} OOMKilled={{.State.OOMKilled}} StartedAt={{.State.StartedAt}}' shopify-filter-sync-worker
            docker exec shopify-filter-sync-worker sh -c 'if test -s /tmp/cfp-background-worker.ready; then echo WORKER_READY_FILE_PRESENT; else echo WORKER_READY_FILE_MISSING; fi'
            printf '%s' '' | base64 -d | docker exec -i -w /app shopify-filter-app node --input-type=module

name: Prepare Formal Dresses price sort from saved data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -eu
            docker exec -i shopify-filter-app sh -c 'cat > /tmp/cfp-json-loader.mjs' <<'LOADER'
            import {readFile} from 'node:fs/promises';
            export async function load(url,context,nextLoad){
              if(url.endsWith('.json'))return {format:'module',shortCircuit:true,source:'export default '+await readFile(new URL(url),'utf8')+';'};
              return nextLoad(url,context);
            }
            LOADER
            docker exec -i shopify-filter-app node --experimental-loader /tmp/cfp-json-loader.mjs --input-type=module <<'NODE'
            import Redis from 'ioredis';
            import {REDIS_URL} from './app/services/redisConnection.server.js';
            const redis=global.__redis=new Redis(REDIS_URL);
            await redis.ping();
            const {collectionRankingQueue:queue}=await import('./app/services/queue.server.js');
            const {processCollectionPreparation}=await import('./app/services/collectionPreparation.server.js');
            const {default:db}=await import('./app/db.server.js');
            try{
              const shop='thedressoutlet.myshopify.com';
              const collection=await db.collection.findFirst({where:{shop,handle:'formal-dresses'},select:{id:true}});
              if(!collection)throw Error('Formal Dresses collection unavailable');
              const ids=await redis.zrange('bull:collectionRankingQueueV2:prioritized',0,100);
              const jobs=(await Promise.all(ids.map(id=>queue.getJob(id)))).filter(Boolean);
              console.log('FORMAL_LOOKUP',JSON.stringify({collectionId:collection.id,priceJobs:jobs.filter(job=>job.data?.spec?.sortBy==='price-ascending').map(job=>({id:job.id,collectionId:job.data.spec.collectionId,priceSortField:job.data.spec.priceSortField,shop:job.data.spec.shop})).slice(0,12)}));
              for(const country of ['US','IN']){
                const chosen=jobs.find(job=>{
                  const spec=job.data?.spec;
                  return job.name==='COLLECTION_RANKING_PREPARE'&&spec?.shop===shop&&spec.collectionId===collection.id&&
                    spec.sortBy==='price-ascending'&&(country==='IN'?String(spec.priceSortField||'').endsWith('_IN'):!spec.priceSortField);
                });
                if(!chosen){console.log('FORMAL_PRICE_JOB_MISSING',country);continue;}
                console.log('FORMAL_PRICE_PREPARE_START',JSON.stringify({country,jobId:chosen.id,collectionId:collection.id}));
                const result=await processCollectionPreparation(chosen.data);
                console.log('FORMAL_PRICE_PREPARE_RESULT',JSON.stringify({country,...result}));
              }
            }finally{await queue.close();redis.disconnect();await db.$disconnect();}
            process.exit(0);
            NODE

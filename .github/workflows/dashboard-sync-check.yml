name: Prepare US price sort from saved data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -eu
            docker exec -i shopify-filter-app node --input-type=module <<'NODE'
            import Redis from 'ioredis';
            import {REDIS_URL} from './app/services/redisConnection.server.js';
            // Connect before importing the server module so its startup cache
            // listener does not run for this one-off preparation process.
            const redis=global.__redis=new Redis(REDIS_URL);
            await redis.ping();
            const {collectionRankingQueue:queue}=await import('./app/services/queue.server.js');
            const {processCollectionPreparation}=await import('./app/services/collectionPreparation.server.js');
            try{
              const ids=await redis.zrange('bull:collectionRankingQueueV2:prioritized',0,30);
              let chosen;
              for(const id of ids){
                const job=await queue.getJob(id),spec=job?.data?.spec;
                if(job?.name==='COLLECTION_RANKING_PREPARE'&&spec?.shop==='thedressoutlet.myshopify.com'&&
                    spec.sortBy==='price-ascending'&&!spec.priceSortField&&
                    String(spec.collectionId||'').split('/').pop()==='408926666'){chosen=job;break;}
              }
              if(!chosen)throw Error('Queued US Prom Dresses price ranking unavailable');
              console.log('US_PRICE_PREPARE_START',JSON.stringify({jobId:chosen.id,collectionId:chosen.data.spec.collectionId,sort:chosen.data.spec.sortBy}));
              const result=await processCollectionPreparation(chosen.data);
              console.log('US_PRICE_PREPARE_RESULT',JSON.stringify(result));
              if(result?.superseded)throw Error('US price ranking was superseded; retry shopper request');
            }finally{await queue.close();redis.disconnect();}
            process.exit(0);
            NODE

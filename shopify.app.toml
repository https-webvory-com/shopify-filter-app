# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f02601eed3e06bd0922c614d7f4084b9"
application_url = "https://aisearchfilter.webvory.com"
embedded = true
name = "AI Search & Filter"
handle = "ai-smart-search-filter"
web_directories = ["."]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders"
  topics = [ "orders/paid", "orders/cancelled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products"
  topics = [ "products/update", "products/create", "products/delete", "inventory_levels/update", "inventory_items/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/collections"
  topics = [ "collections/create", "collections/update", "collections/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]



[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_inventory,read_locations,read_themes,write_metaobject_definitions,write_metaobjects,write_products,write_themes,read_orders,read_all_orders"
optional_scopes = ["unauthenticated_read_product_listings"]

[auth]
redirect_urls = [ "https://aisearchfilter.webvory.com/api/auth" ]

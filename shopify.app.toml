# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f02601eed3e06bd0922c614d7f4084b9"
name = "AI Search & Filter"
application_url = "https://bless-pharmaceuticals-ann-das.trycloudflare.com"
embedded = true
handle = "ai-smart-search-filter"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products"
  topics = [ "products/create", "products/update", "products/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_inventory,read_locations,read_themes,write_metaobject_definitions,write_metaobjects,write_products"

[auth]
redirect_urls = [
  "https://bless-pharmaceuticals-ann-das.trycloudflare.com/api/auth"
]

[app_proxy]
url = "https://bless-pharmaceuticals-ann-das.trycloudflare.com"
subpath = "collection-filter-pro"
prefix = "apps"

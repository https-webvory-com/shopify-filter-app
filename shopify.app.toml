# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f02601eed3e06bd0922c614d7f4084b9"
name = "AI Search & Filter"
application_url = "https://authors-troubleshooting-insurance-mention.trycloudflare.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products"
  topics = [
    "products/create",
    "products/update",
    "products/delete"
  ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions,read_inventory,read_locations,read_themes"


[auth]
redirect_urls = [ "https://authors-troubleshooting-insurance-mention.trycloudflare.com/api/auth" ]


[app_proxy]
url = "https://authors-troubleshooting-insurance-mention.trycloudflare.com"
prefix = "apps"
subpath = "collection-filter-pro"

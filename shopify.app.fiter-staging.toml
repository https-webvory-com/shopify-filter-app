# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f0784c29e822aa5959ef9f0417095b8c"
application_url = "https://tongue-slots-atlas-electron.trycloudflare.com"
embedded = true
name = "fiter-staging"




[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products"
  topics = [ "products/create", "products/update", "products/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

    
 [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]


[access_scopes]
scopes = "read_inventory,read_locations,read_themes,write_metaobject_definitions,write_metaobjects,write_products"

[auth]
redirect_urls = [
  "https://tongue-slots-atlas-electron.trycloudflare.com/api/auth"
]

[app_proxy]
url = "https://tongue-slots-atlas-electron.trycloudflare.com"
subpath = "collection-filter-pro"
prefix = "apps"
